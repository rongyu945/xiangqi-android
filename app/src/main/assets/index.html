    /* ===================== 棋盘绘制 ===================== */
    buildBoardSVG() {
        const NS = 'http://www.w3.org/2000/svg';
        const svg = document.createElementNS(NS, 'svg');
        svg.setAttribute('viewBox', '0 0 9 10');
        svg.setAttribute('class', 'board-svg');
        svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');

        const line = (x1, y1, x2, y2, cls) => {
            const l = document.createElementNS(NS, 'line');
            l.setAttribute('x1', x1); l.setAttribute('y1', y1);
            l.setAttribute('x2', x2); l.setAttribute('y2', y2);
            if (cls) l.setAttribute('class', cls);
            svg.appendChild(l);
        };

        for (let r = 0; r < 10; r++) line(0.5, 0.5 + r, 8.5, 0.5 + r);
        for (let c = 0; c < 9; c++) {
            if (c === 0 || c === 8) {
                line(0.5 + c, 0.5, 0.5 + c, 9.5);
            } else {
                line(0.5 + c, 0.5, 0.5 + c, 4.5);
                line(0.5 + c, 5.5, 0.5 + c, 9.5);
            }
        }
        line(3.5, 0.5, 5.5, 2.5); line(5.5, 0.5, 3.5, 2.5);
        line(3.5, 7.5, 5.5, 9.5); line(5.5, 7.5, 3.5, 9.5);
        const rect = document.createElementNS(NS, 'rect');
        rect.setAttribute('x', 0.5); rect.setAttribute('y', 0.5);
        rect.setAttribute('width', 8); rect.setAttribute('height', 9);
        rect.setAttribute('class', 'frame');
        svg.appendChild(rect);

        const marks = [[3,0],[3,2],[3,4],[3,6],[3,8],[6,0],[6,2],[6,4],[6,6],[6,8],[2,1],[2,7],[7,1],[7,7]];
        marks.forEach(([r, c]) => {
            const x = 0.5 + c, y = 0.5 + r;
            const d = 0.09, g = 0.05;
            const segs = [];
            if (c > 0) { segs.push([x - d - g, y - d, x - g, y - d]); segs.push([x - d - g, y + d, x - g, y + d]); }
            if (c < 8) { segs.push([x + g, y - d, x + d + g, y - d]); segs.push([x + g, y + d, x + d + g, y + d]); }
            segs.forEach(s => {
                const l = document.createElementNS(NS, 'line');
                l.setAttribute('x1', s[0]); l.setAttribute('y1', s[1]);
                l.setAttribute('x2', s[2]); l.setAttribute('y2', s[3]);
                l.setAttribute('stroke-width', '0.022');
                svg.appendChild(l);
            });
        });

        const t1 = document.createElementNS(NS, 'text');
        t1.setAttribute('x', 2.15); t1.setAttribute('y', 5.0);
        t1.setAttribute('text-anchor', 'middle');
        t1.setAttribute('dominant-baseline', 'central');
        t1.setAttribute('class', 'river-text');
        t1.textContent = '楚 河';
        svg.appendChild(t1);

        const t2 = document.createElementNS(NS, 'text');
        t2.setAttribute('x', 6.85); t2.setAttribute('y', 5.0);
        t2.setAttribute('text-anchor', 'middle');
        t2.setAttribute('dominant-baseline', 'central');
        t2.setAttribute('class', 'river-text');
        t2.textContent = '汉 界';
        svg.appendChild(t2);

        this.boardWrapper.insertBefore(svg, this.marksLayer);
    }

    /* ===================== 坐标换算 ===================== */
    toDisplay(r, c) {
        return this.flipped ? [9 - r, 8 - c] : [r, c];
    }
    leftPct(r, c) {
        const d = this.toDisplay(r, c);
        return ((d[1] + 0.5) / 9) * 100;
    }
    topPct(r, c) {
        const d = this.toDisplay(r, c);
        return ((d[0] + 0.5) / 10) * 100;
    }

    onBoardClick(e) {
        if (this.gameOver || this.isThinking || this.isAnimating) return;
        if (this.gameMode === 'pvc' && this.currentPlayer !== this.playerColorValue()) return;

        const rect = this.boardWrapper.getBoundingClientRect();
        const px = (e.clientX - rect.left) / rect.width;
        const py = (e.clientY - rect.top) / rect.height;
        let dc = Math.round(px * 9 - 0.5);
        let dr = Math.round(py * 10 - 0.5);
        if (dc < 0 || dc > 8 || dr < 0 || dr > 9) return;
        let r = dr, c = dc;
        if (this.flipped) { r = 9 - dr; c = 8 - dc; }
        this.handleCellClick(r, c);
    }

    playerColorValue() { return this.playerColor === 'b' ? XQ.BLACK : XQ.RED; }
    aiColorValue() { return this.playerColor === 'b' ? XQ.RED : XQ.BLACK; }

    /* 双人模式：棋盘上方(远离当前操作者)一方的颜色 —— 棋子要倒置 180° */
    getTopColor() {
        // flipped=false（红方在下方）→ 上方是黑方
        // flipped=true （黑方在下方）→ 上方是红方
        return this.flipped ? XQ.RED : XQ.BLACK;
    }
    /* 双人模式：棋盘下方(当前操作者)一方的颜色 —— 与 getTopColor 相反 */
    getBottomColor() {
        return this.flipped ? XQ.BLACK : XQ.RED;
    }
    /* 判断某个棋子是否属于"棋盘上方一方"，需要倒置显示（仅 pvp 模式） */
    pieceFacingUp(piece) {
        return this.gameMode === 'pvp' && XQ.getColor(piece) === this.getTopColor();
    }

    /* ===================== 渲染 ===================== */
    render() {
        this._updatePiecesLayer();
        // 标记层
        const marksHtml = [];
        if (this.lastMove && !this.gameOver) {
            marksHtml.push('<div class="mark-last" style="left:' + this.leftPct(this.lastMove.from[0], this.lastMove.from[1]) +
                '%;top:' + this.topPct(this.lastMove.from[0], this.lastMove.from[1]) + '%"></div>');
            marksHtml.push('<div class="mark-last" style="left:' + this.leftPct(this.lastMove.to[0], this.lastMove.to[1]) +
                '%;top:' + this.topPct(this.lastMove.to[0], this.lastMove.to[1]) + '%"></div>');
        }
        if (this.selected) {
            marksHtml.push('<div class="mark-ring" style="left:' + this.leftPct(this.selected[0], this.selected[1]) +
                '%;top:' + this.topPct(this.selected[0], this.selected[1]) + '%"></div>');
        }
        for (let i = 0; i < this.validMoves.length; i++) {
            const m = this.validMoves[i];
            const isCap = m.captured !== 0;
            marksHtml.push('<div class="' + (isCap ? 'mark-capture' : 'mark-dot') + '" style="left:' +
                this.leftPct(m.to[0], m.to[1]) + '%;top:' + this.topPct(m.to[0], m.to[1]) + '%"></div>');
        }
        const marksKey = marksHtml.join('');
        if (this._lastMarksHtml !== marksKey) {
            this._lastMarksHtml = marksKey;
            this.marksLayer.innerHTML = marksKey;
        }

        this.updateStatus();
        this.updateCaptured();
        this.updateMoveHistory();
        this.drawHintArrow();
    }

    /* 重建棋子层 —— 每个棋子带 data-row/data-col 方便动画定位 */
    _updatePiecesLayer() {
        if (!this.piecesLayer) return;
        this.piecesLayer.innerHTML = '';
        const frag = document.createDocumentFragment();
        for (let r = 0; r < 10; r++) {
            for (let c = 0; c < 9; c++) {
                const p = this.board[r][c];
                if (p === 0) continue;
                const el = document.createElement('div');
                el.className = 'xq-piece ' + (p > 0 ? 'red' : 'black');
                el.dataset.row = r;
                el.dataset.col = c;
                el.style.left = this.leftPct(r, c) + '%';
                el.style.top = this.topPct(r, c) + '%';
                el.style.transform = 'translate(-50%,-50%)';
                // 双人模式：上方一方棋子倒置 180°
                const glyphCls = this.pieceFacingUp(p) ? 'xq-glyph piece-rotated' : 'xq-glyph';
                el.innerHTML = '<span class="' + glyphCls + '">' + PIECE_CHARS[p] + '</span>';
                if (this.selected && this.selected[0] === r && this.selected[1] === c) el.classList.add('selected');
                if (this.gameOver) el.classList.add('frozen');
                frag.appendChild(el);
            }
        }
        this.piecesLayer.appendChild(frag);
    }

    updateStatus() {
        const inCheck = XQ.isInCheck(this.board, this.currentPlayer);
        this.boardFrame.classList.toggle('checking', inCheck && !this.gameOver);
        if (inCheck && !this.gameOver) {
            this.statusBarEl.classList.add('check-alert');
            if (!this._checkSoundPlayed) { SoundManager.playCheck(); this._checkSoundPlayed = true; }
        } else {
            this.statusBarEl.classList.remove('check-alert');
            if (!inCheck) this._checkSoundPlayed = false;
        }

        let turnName;
        if (this.gameOver) {
            turnName = '';
        } else if (this.gameMode === 'pvc') {
            turnName = this.currentPlayer === this.playerColorValue() ? '您' : 'AI';
        } else {
            turnName = this.currentPlayer === XQ.RED ? '红方' : '黑方';
        }
        if (this.gameOver) {
            this.statusTextEl.textContent = '对局结束';
        } else {
            this.statusTextEl.textContent = inCheck ? (turnName + '被将军！') : ('轮到' + turnName + '走棋');
        }
        this.turnIndicator.className = 'turn-indicator ' + (this.currentPlayer === XQ.RED ? 'red' : 'black');

        const ev = XQ.evaluate(this.board);
        const myView = this.gameMode === 'pvc' ? this.playerColorValue() : XQ.RED;
        const myEval = ev * myView;
        let txt;
        if (Math.abs(myEval) < 120) txt = '均势';
        else {
            const who = myEval > 0 ? '我方' : '对方';
            const v = (Math.abs(myEval) / 100).toFixed(1);
            txt = who + '领先 ' + v;
        }
        this.evalScoreEl.textContent = this.isThinking ? '' : txt;
        if (this.isThinking) {
            this.thinkingIndicator.classList.add('show');
            this.evalScoreEl.style.display = 'none';
        } else {
            this.thinkingIndicator.classList.remove('show');
            this.evalScoreEl.style.display = '';
        }
    }

    updateCaptured() {
        const fmt = (arr) => arr.map(p => {
            const red = p > 0;
            return '<span class="cap-piece ' + (red ? 'red' : 'black') + '">' + PIECE_CHARS[p] + '</span>';
        }).join('');
        const topArr = this.flipped ? this.capturedByRed : this.capturedByBlack;
        const botArr = this.flipped ? this.capturedByBlack : this.capturedByRed;
        const topHtml = fmt(topArr);
        const botHtml = fmt(botArr);
        if (this._capTop !== topHtml) { this._capTop = topHtml; this.capturedByBlackEl.innerHTML = topHtml; }
        if (this._capBot !== botHtml) { this._capBot = botHtml; this.capturedByRedEl.innerHTML = botHtml; }
    }

    updateMoveHistory() {
        let html = '';
        const last = this.moveTexts.length - 1;
        // v1.6.6：已生成复盘评价的着法加 analyzed 类（虚线下划线），提示"可点击查看"
        const analyzed = this._analysisResults || null;
        const hasA = (idx) => !!(analyzed && analyzed.some(x => x && x.ply === idx));
        for (let i = 0; i < this.moveTexts.length; i += 2) {
            const num = Math.floor(i / 2) + 1;
            const a = this.moveTexts[i] || '';
            const b = this.moveTexts[i + 1] || '';
            const isLast = (i === last || i + 1 === last);
            html += '<span class="move-entry' + (isLast ? ' cur' : '') + '">' + num + '.';
            if (a) html += '<span class="ply' + (hasA(i) ? ' analyzed' : '') + '" data-ply="' + i + '">' + a + '</span>';
            if (b) html += '<span class="ply' + (hasA(i + 1) ? ' analyzed' : '') + '" data-ply="' + (i + 1) + '">' + b + '</span>';
            html += '</span>';
        }
        if (this._lastMoveHtml !== html) {
            this._lastMoveHtml = html;
            this.moveListEl.innerHTML = html;
            this.moveListEl.scrollTop = this.moveListEl.scrollHeight;
        }
    }

    drawHintArrow() {
        const old = this.boardWrapper.querySelector('.hint-arrow-svg');
        if (old) old.remove();
        if (!this.hintMove || this.gameOver) return;
        const a = this.hintMove.from, b = this.hintMove.to;
        const x1 = this.leftPct(a[0], a[1]), y1 = this.topPct(a[0], a[1]);
        const x2 = this.leftPct(b[0], b[1]), y2 = this.topPct(b[0], b[1]);
        const svgNS = 'http://www.w3.org/2000/svg';
        const svg = document.createElementNS(svgNS, 'svg');
        svg.setAttribute('class', 'hint-arrow-svg');
        svg.setAttribute('viewBox', '0 0 100 100');
        svg.setAttribute('preserveAspectRatio', 'none');
        const defs = document.createElementNS(svgNS, 'defs');
        const marker = document.createElementNS(svgNS, 'marker');
        marker.setAttribute('id', 'xqArrowHead');
        marker.setAttribute('markerWidth', '6');
        marker.setAttribute('markerHeight', '6');
        marker.setAttribute('refX', '5');
        marker.setAttribute('refY', '3');
        marker.setAttribute('orient', 'auto');
        const path = document.createElementNS(svgNS, 'path');
        path.setAttribute('d', 'M0,0 L6,3 L0,6 z');
        path.setAttribute('fill', '#9ca3af');
        marker.appendChild(path);
        defs.appendChild(marker);
        svg.appendChild(defs);

        const dx = x2 - x1, dy = y2 - y1;
        const len = Math.sqrt(dx * dx + dy * dy) || 1;
        const ux = dx / len, uy = dy / len;
        const sx = x1 + ux * 4, sy = y1 + uy * 4;
        const ex = x2 - ux * 5, ey = y2 - uy * 5;

        const l = document.createElementNS(svgNS, 'line');
        l.setAttribute('x1', sx); l.setAttribute('y1', sy);
        l.setAttribute('x2', ex); l.setAttribute('y2', ey);
        l.setAttribute('stroke', '#9ca3af');
        l.setAttribute('stroke-width', '0.9');
        l.setAttribute('stroke-linecap', 'round');
        l.setAttribute('marker-end', 'url(#xqArrowHead)');
        svg.appendChild(l);
        this.boardWrapper.appendChild(svg);
    }

    /* ===================== 交互 ===================== */
    handleCellClick(r, c) {
        const p = this.board[r][c];
        if (this.selected) {
            const mv = this.validMoves.find(m => m.to[0] === r && m.to[1] === c);
            if (mv) {
                this.selected = null;
                this.validMoves = [];
                this.executeMoveWithAnimation(mv, true);
                return;
            }
        }
        if (p !== 0 && XQ.getColor(p) === this.currentPlayer) {
            this.selected = [r, c];
            this.validMoves = XQ.legalMoves(this.board, this.currentPlayer)
                .filter(m => m.from[0] === r && m.from[1] === c);
            this.render();
        } else {
            this.selected = null;
            this.validMoves = [];
            this.render();
        }
    }

    saveState() {
        this.historyStack.push({
            board: XQ.cloneBoard(this.board),
            currentPlayer: this.currentPlayer,
            capturedByRed: this.capturedByRed.slice(),
            capturedByBlack: this.capturedByBlack.slice(),
            lastMove: this.lastMove ? { from: this.lastMove.from.slice(), to: this.lastMove.to.slice(), piece: this.lastMove.piece, captured: this.lastMove.captured } : null,
            moveTexts: this.moveTexts.slice(),
            moveRecords: this.moveRecords.slice(),
            positionHistory: this.positionHistory ? this.positionHistory.slice() : [],
            checkStreakBySide: this._checkStreakBySide ? Object.assign({}, this._checkStreakBySide) : { 1: 0, '-1': 0 },
            // v1.6.6：连将方也必须快照。否则悔棋后 _lastCheckSide 还是悔棋前的值，
            // 而 _checkStreakBySide 已回退到更早的值——两者不一致会让长将判负
            // 把责任算在错误的一方头上（已复现）。
            lastCheckSide: this._lastCheckSide || 0
        });
    }

    /* ===================== 走子（带滑动动画） ===================== */
    async executeMoveWithAnimation(move, isHuman) {
        if (this.isAnimating) return;
        const token = ++this.animationToken;
        this.isAnimating = true;
        if (isHuman) this.humanMoved = true;
        this.selected = null;
        this.validMoves = [];
        this.render();   // 立即清掉选中高亮与落点灰点

        this.saveState();

        const piece = this.board[move.from[0]][move.from[1]];
        const isCapture = move.captured !== 0;
        const wasFacingUp = this.pieceFacingUp(piece);

        // 起点与终点的百分比位置
        const fromLeft = this.leftPct(move.from[0], move.from[1]);
        const fromTop = this.topPct(move.from[0], move.from[1]);
        const toLeft = this.leftPct(move.to[0], move.to[1]);
        const toTop = this.topPct(move.to[0], move.to[1]);

        // 创建动画棋子（放在 boardWrapper 里，避免被 render() 重建时清掉）
        const animPiece = document.createElement('div');
        animPiece.className = 'xq-piece animating-piece ' + (piece > 0 ? 'red' : 'black') + (isHuman ? '' : ' ai-anim');
        animPiece.style.left = fromLeft + '%';
        animPiece.style.top = fromTop + '%';
        animPiece.style.transform = 'translate(-50%,-50%)';
        const glyphCls = wasFacingUp ? 'xq-glyph piece-rotated' : 'xq-glyph';
        animPiece.innerHTML = '<span class="' + glyphCls + '">' + PIECE_CHARS[piece] + '</span>';
        this.boardWrapper.appendChild(animPiece);

        // 隐藏起点棋子（piecesLayer 中对应位置的元素）
        const startEl = this.piecesLayer.querySelector('.xq-piece[data-row="' + move.from[0] + '"][data-col="' + move.from[1] + '"]');
        if (startEl) startEl.style.visibility = 'hidden';

        // 等待一帧，让起点位置渲染出来
        await new Promise(resolve => {
            const rafId = requestAnimationFrame(resolve);
            setTimeout(() => { cancelAnimationFrame(rafId); resolve(); }, 50);
        });
        if (token !== this.animationToken) {
            animPiece.remove();
            this.isAnimating = false;
            return;
        }

        // 触发过渡：改为终点位置
        animPiece.style.left = toLeft + '%';
        animPiece.style.top = toTop + '%';

        // 等待过渡完成（与 CSS .animating-piece 的 transition 时长一致）
        const animDuration = isHuman ? 320 : 380;
        await new Promise(resolve => setTimeout(resolve, animDuration));
        if (token !== this.animationToken) {
            animPiece.remove();
            this.isAnimating = false;
            return;
        }

        // 移除动画棋子
        animPiece.remove();

        // 音效
        if (isCapture) SoundManager.playCapture();
        else SoundManager.playMove();

        // 应用走子（更新棋盘状态 + 重建棋子层）
        this._applyMove(move);
        this.isAnimating = false;

        // 走子后处理（练习模式判定 / 终局判定 / AI 调度）
        this._afterMove(move, piece, isCapture);
    }

    _applyMove(move) {
        // v1.6.5 修复：开局库着法 move 对象未带 captured 字段（undefined）——
        // 之前 undefined !== 0 被误判为吃子，把 undefined push 进 capturedByRed/Black，
        // 吃子面板渲染出 "undefined" 字样。这里统一归一化，杜绝任何来源的裸 move。
        if (move.captured === undefined || move.captured === null) move.captured = 0;
        const piece = this.board[move.from[0]][move.from[1]];
        // v1.6.6 加固：防御非法/空气着法——起点必须真有棋子，且目标不得是己方子。
        // 万一有任何脏数据（剧本写错、外部调用）流到这层，宁可拒绝这一手也不破坏棋盘：
        // 原实现会把 0(空) 搬到目标、或让棋子无声消失、并把回合推进，导致对局错乱。
        if (!piece) return false;
        const dst = this.board[move.to[0]][move.to[1]];
        if (dst !== 0 && ((dst > 0) === (piece > 0))) return false;
        const isCapture = move.captured !== 0;
        this.lastMove = move;

        this.board[move.to[0]][move.to[1]] = piece;
        this.board[move.from[0]][move.from[1]] = 0;

        if (isCapture) {
            if (move.captured > 0) this.capturedByBlack.push(move.captured);
            else this.capturedByRed.push(move.captured);
        }

        const text = this.moveToChinese(move, piece);
        this.moveTexts.push(text);
        this.moveRecords.push({
            from: move.from.slice(), to: move.to.slice(), piece: piece, captured: move.captured, text: text
        });

        this.currentPlayer = -this.currentPlayer;
        this.hintMove = null;
        this._lastMarksHtml = null;

        // v1.6.5 重复局面/长将检测：走子后记录局面 key（含轮到谁走）
        const mover = -this.currentPlayer;   // 刚走的一方
        this.positionHistory.push(this._boardKey());
        // 连续将军计数：走完后若对方被将军，则 mover 连将+1；否则 mover 自己的计数清零。
        // v1.6.8 修正：不再清零对手的计数。连将的语义是「同一方在自己每个回合都将军」，
        // 双方计数各记各的——对手上一步的计数在对手当时就已维护好，这里碰它等于把
        // 「红将军→黑逃→红再将军」这种标准长将从中间打断：红方计数每轮都被黑方抹掉，
        // 永远停在 1，长将判负形同虚设。已复现：车长将循环连走 12 手不判负，
        // 反被第 9 手的「三次重复判和」接管。
        // v1.6.6 的原意是防「陈旧计数误伤」：某方连将 3 次后计数残留，另一方仅将军
        // 1 次就被双方 max 抬到 >=3 判负。该问题改用「只读当前将军方的计数」根治，
        // 不必去清零对手。
        const inCheck = XQ.isInCheck(this.board, this.currentPlayer);
        this._checkStreakBySide[mover] = inCheck ? (this._checkStreakBySide[mover] || 0) + 1 : 0;
        if (inCheck) {
            this._lastCheckSide = mover;
            // 取「正在将军那一方」的计数，而非双方最大值 —— 杜绝陈旧计数误伤
            this._continuousChecks = this._checkStreakBySide[mover] || 0;
        } else {
            // 当前无人被将军：连将序列已中断
            this._continuousChecks = 0;
        }

        this.render();
        this.updateControlsState();
    }

    // 棋盘局面 key：直接用引擎 ZOBRIST 哈希（与 AI 搜索内部视角完全一致），
    // 走子方用 currentPlayer 体现（哈希含 turnKey/blackSideKey）
    _boardKey() {
        return XQ.keyOf(this.board, this.currentPlayer);
    }

    // v1.6.5 跨步重复避免：返回整局中已出现 ≥2 次的局面 key 列表。
    // 语义：AI 走完自己一步后，若新局面的 key 命中这些 key → 会形成第 3 次重复，
    // 搜索在 makeMove 后按"轮到对方"视角(keyOf(board,-color))匹配并过滤该着法。
    // 注意：positionHistory 存的是"每步走完后轮到的一方"视角。AI 走完必轮到对方，
    // 因此只保留"对方视角"的重复 key；"当前视角"(轮到currentPlayer)的 key AI 一步
    // 走不到（走子方必翻转），排除以免误伤。
    _avoidKeys() {
        if (!this.positionHistory || this.positionHistory.length < 4) return [];
        const counts = new Map();
        for (let i = 0; i < this.positionHistory.length; i++) {
            const k = this.positionHistory[i];
            counts.set(k, (counts.get(k) || 0) + 1);
        }
        const avoid = [];
        counts.forEach((cnt, k) => { if (cnt >= 2) avoid.push(k); });
        return avoid;
    }

    _afterMove(move, piece, isCapture) {
        // 练习模式判定
        if (this.practiceMode && !this.practiceDone) {
            const ex = PRACTICE_POSITIONS[this.practiceIndex];
            const justMoved = (piece > 0 && this.playerColor === 'r') || (piece < 0 && this.playerColor === 'b');
            if (justMoved) {
                const used = this.practiceUsed();
                if (used > ex.limit) {
                    this.practiceFinish(false, '超过步数上限了，再试一次吧。');
                    return;
                }
            }
        }

        if (this.checkGameEnd()) return;
        this.saveGame();

        if (this.gameMode === 'pvc' && this.currentPlayer === this.aiColorValue()) {
            this.scheduleAI();
        }
    }

    practiceUsed() {
        const startIdx = this.playerColor === 'r' ? 0 : 1;
        let n = 0;
        for (let i = startIdx; i < this.moveTexts.length; i += 2) n++;
        return n;
    }

    /* ===================== 中文记谱 ===================== */
    moveToChinese(move, piece) {
        const t = XQ.getType(piece);
        const isRed = piece > 0;
        const fr = move.from[0], fc = move.from[1];
        const tr = move.to[0], tc = move.to[1];
        const name = PIECE_CHARS[piece];

        const fileStr = (col) => isRed ? CN_NUM[8 - col] : String(col + 1);
        let action, target;
        if (fr === tr) {
            action = '平';
            target = fileStr(tc);
        } else {
            const forward = isRed ? (tr < fr) : (tr > fr);
            action = forward ? '进' : '退';
            if (t === XQ.HORSE || t === XQ.ELEPHANT || t === XQ.ADVISOR) {
                target = fileStr(tc);
            } else {
                const steps = Math.abs(tr - fr);
                target = isRed ? CN_NUM[steps - 1] : String(steps);
            }
        }
        return name + fileStr(fc) + action + target;
    }

    /* ===================== 胜负判定 ===================== */
    checkGameEnd() {
        if (this.gameOver) return true;
        // 残局子力判和：双方都无进攻子(马/炮/车/过河兵)则和棋
        if (XQ.isDrawByMaterial(this.board)) {
            this.gameOver = true;
            if (this.practiceMode) {
                this.practiceFinish(false, '子力不足，判为和棋。');
            } else {
                this.showModal('和棋', '双方子力不足，无法分出胜负！', 'end');
                SoundManager.playGameEnd();
            }
            this.clearSavedGame();
            return true;
        }

        // v1.6.5 长将判负（修正）：只有"无效连将"才判负——同一方连续将军 ≥3 次
        // 且 当前局面在 positionHistory 中已出现 ≥2 次（形成循环，无实质进展）。
        // 有效连将（步步推进、最终将死）局面不重复，不判负。
        const streak = this._continuousChecks || 0;
        if (streak >= 3 && XQ.legalMoves(this.board, this.currentPlayer).length > 0) {
            const curKey = this._boardKey();
            let repCnt = 0;
            if (this.positionHistory) {
                for (let i = 0; i < this.positionHistory.length; i++) if (this.positionHistory[i] === curKey) repCnt++;
            }
            if (repCnt < 2) { /* 有效连将（局面在推进），不判负 */ }
            else {
            const loser = this._lastCheckSide || -this.currentPlayer;
            this.gameOver = true;
            if (this.practiceMode) {
                const won = loser !== this.playerColorValue();
                this.practiceFinish(won, won ? '对方长将判负，你赢了！' : '长将判负，再试一次。');
            } else {
                const loserName = loser === XQ.RED ? '红方' : '黑方';
                const winName = loser === XQ.RED ? (this.gameMode === 'pvc' && this.aiColorValue() === XQ.BLACK ? 'AI' : '黑方') : (this.gameMode === 'pvc' && this.aiColorValue() === XQ.RED ? 'AI' : '红方');
                this.showModal('长将判负', loserName + '连续将军三次（无效长将），判负！' + winName + '获胜！', 'end');
                SoundManager.playGameEnd();
            }
            this.clearSavedGame();
            this.updateControlsState();
            this.render();
            return true;
            }
        }

        // v1.6.5 三次重复局面判和：同一局面（含轮走方）出现 ≥3 次 → 和棋
        if (this.positionHistory && this.positionHistory.length >= 5) {
            const cur = this._boardKey();
            let cnt = 0;
            for (let i = 0; i < this.positionHistory.length; i++) if (this.positionHistory[i] === cur) cnt++;
            if (cnt >= 3) {
                this.gameOver = true;
                if (this.practiceMode) {
                    this.practiceFinish(false, '三次重复局面，判为和棋。');
                } else {
                    this.showModal('和棋', '三次重复局面，判为和棋！', 'end');
                    SoundManager.playGameEnd();
                }
                this.clearSavedGame();
                this.updateControlsState();
                this.render();
                return true;
            }
        }

        const moves = XQ.legalMoves(this.board, this.currentPlayer);
        if (moves.length === 0) {
            this.gameOver = true;
            const inCheck = XQ.isInCheck(this.board, this.currentPlayer);
            const winnerColor = -this.currentPlayer;

            if (this.practiceMode) {
                const won = winnerColor === this.playerColorValue();
                this.practiceFinish(won, won ? '漂亮的将杀！' : (inCheck ? '被对方将杀了，再试一次。' : '被困毙了，再试一次。'));
                return true;
            }

            let winName = winnerColor === XQ.RED ? '红方' : '黑方';
            if (this.gameMode === 'pvc' && winnerColor === this.aiColorValue()) winName = 'AI';
            const reason = inCheck ? '将杀！' : '困毙！';
            this.showModal(reason, winName + '获胜！', 'end');
            SoundManager.playGameEnd();
            this.clearSavedGame();
            this.updateControlsState();
            this.render();
            return true;
        }
        return false;
    }

    /* ===================== AI ===================== */
    /* ---- 开局库：AI 开局阶段按定式走棋，避免评估函数在平淡开局的钝化 ----
       moves 为交替着法（红先），每步 { from, to, piece }；text 由 moveToChinese 实时生成，
       与已走 moveTexts 前缀匹配，命中则返回谱中该轮到的一步坐标。 */
    openingBookMove() {
        const t = this.moveTexts;
        if (t.length < 1 || t.length > OPENING_DEPTH) return null;
        // v1.6.6 加固：命中谱着后必须校验"该着法在当前棋盘合法"，否则回落引擎搜索。
        // 原实现只比对记谱文本前缀、完全不校验棋盘——谱内一处坐标写错就会走出
        // "起点无子的空气着法"（棋盘不动但回合被消耗，记谱打印 undefined），
        // 甚至覆盖己方子力。此校验让任何脏数据都无法再污染对局。
        const legal = XQ.legalMoves(this.board, this.currentPlayer);
        for (let i = 0; i < OPENINGS.length; i++) {
            const line = OPENINGS[i].moves;
            if (line.length <= t.length) continue;
            let ok = true;
            for (let k = 0; k < t.length; k++) {
                const text = this.moveToChinese({ from: line[k].from, to: line[k].to }, line[k].piece);
                if (text !== t[k]) { ok = false; break; }
            }
            if (!ok) continue;
            const nxt = line[t.length];
            // 谱着必须与实际轮到方一致，且是当前局面的合法着法
            if (nxt.piece > 0 !== (this.currentPlayer === XQ.RED)) continue;
            const hit = legal.find(m => m.from[0] === nxt.from[0] && m.from[1] === nxt.from[1]
                                     && m.to[0] === nxt.to[0] && m.to[1] === nxt.to[1]);
            if (hit) return { from: hit.from.slice(), to: hit.to.slice(), captured: hit.captured || 0 };
        }
        return null;
    }

    scheduleAI() {
        if (this.gameMode !== 'pvc') return;
        this.isThinking = true;
        this.render();
        const gen = ++this._aiGen;
        const color = this.aiColorValue();
        const level = this.difficulty;

        let started = false;
        const start = async () => {
            if (started) return;
            started = true;
            if (this.aiFrame) { cancelAnimationFrame(this.aiFrame); this.aiFrame = null; }
            if (this.aiTimer) { clearTimeout(this.aiTimer); this.aiTimer = null; }
            if (gen !== this._aiGen) { this.isThinking = false; this.render(); return; }

            let move = null;
            try {
                move = this.openingBookMove();
                if (!move) {
                    // v1.6.5：搜索走 Web Worker，大师档 1~3s 不再卡界面；Worker 不可用回退同步搜索
                    const avoidKeys = this._avoidKeys();
                    const req = XQWorker.findBestMoveAsync({ board: this.board, color: color, level: level, avoidKeys: avoidKeys });
                    if (req) {
                        const res = await req;   // 期间界面完全流畅；被中断则结果由 gen 校验作废；超时/异常会 resolve(null)
                        if (res && res.ok) move = res.move;
                    }
                    // v1.6.5 连贯性兜底：Worker 超时/异常/不可用 → 立即同步搜索（同步搜索自身有
                    // 时间预算 abort，绝不会无限卡），保证 AI 回合一定能走出棋。
                    if (!move) {
                        // v1.7.0：回退同步搜索限时 1.2s（默认大师档 3s），避免主线程冻结过久
                        move = XQ.findBestMove(this.board, color, level, avoidKeys, 1200);
                    }
                }
            } catch (e) { move = null; }

            if (gen !== this._aiGen) { this.isThinking = false; this.render(); return; }
            this.isThinking = false;
            if (!move) {
                // v1.6.5 最后兜底：连同步搜索都拿不到着法时，走"第一个合法着法"，
                // 无论如何不让 AI 回合卡住（此时多半已接近终局，走完由 checkGameEnd 收尾）。
                try {
                    const legal = XQ.legalMoves(this.board, color);
                    if (legal && legal.length > 0) move = legal[0];
                } catch (e2) { move = null; }
            }
            if (!move) {
                this.render();
                this.checkGameEnd();
                return;
            }
            this.executeMoveWithAnimation(move, false);
        };
        this.aiFrame = requestAnimationFrame(start);
        this.aiTimer = setTimeout(start, 120);
    }

    /* ===================== 悔棋 ===================== */
    undoMove(byColor, isBottom) {
        if (this.gameOver) { this.showToast('对局已结束，请点"新对局"重开'); return; }
        if (this.isAnimating) return;
        if (this.historyStack.length === 0) { this.showToast('没有可悔的棋'); return; }

        // 双人模式：只能悔自己刚走的那一步
        if (this.gameMode === 'pvp' && byColor !== undefined) {
            if (this.currentPlayer === byColor) {
                this.showToast('您还没走棋，无法悔棋', !isBottom);
                return;
            }
        }

        const undoBy = (byColor !== undefined && byColor !== null) ? byColor
            : (this.gameMode === 'pvp' ? -this.currentPlayer : this.playerColorValue());

        // 执黑时红方刚走完第一步 → 无玩家自己的棋可悔
        if (this.gameMode === 'pvc' && this.playerColor === 'b' && this.moveTexts.length <= 1) {
            this.showToast('你还没走棋，无法悔棋');
            return;
        }

        if (!this.practiceMode) {
            if (this.gameMode === 'pvp') {
                const used = undoBy === XQ.RED ? this.undoUsedR : this.undoUsedB;
                if (3 - used <= 0) { this.showToast('悔棋次数已用完（上限 3 次）', !isBottom); return; }
            } else {
                if (this.undoLeft() <= 0) {
                    this.showToast('本局悔棋次数已用完（上限 ' + this.undoLimit() + ' 次）');
                    return;
                }
            }
        }

        this.animationToken++;
        if (this.aiTimer) { clearTimeout(this.aiTimer); this.aiTimer = null; }
        if (this.aiFrame) { cancelAnimationFrame(this.aiFrame); this.aiFrame = null; }
        this._aiGen++;
        this.isThinking = false;
        this.isAnimating = false;
        // 清掉可能残留的动画棋子
        this.boardWrapper.querySelectorAll('.animating-piece').forEach(el => el.remove());

        let pops = 1;
        if (this.gameMode === 'pvc' && this.currentPlayer === this.playerColorValue() && this.historyStack.length >= 2) {
            pops = 2;
        }
        if (this.practiceMode) pops = 1;

        let target = null;
        for (let i = 0; i < pops; i++) {
            if (this.historyStack.length === 0) break;
            target = this.historyStack.pop();
        }
        if (!target) { this.showToast('没有可悔的棋'); return; }

        this.board = target.board;
        this.currentPlayer = target.currentPlayer;
        this.capturedByRed = target.capturedByRed;
        this.capturedByBlack = target.capturedByBlack;
        this.lastMove = target.lastMove;
        this.moveTexts = target.moveTexts;
        this.moveRecords = target.moveRecords;
        if (target.positionHistory !== undefined) {
            this.positionHistory = target.positionHistory;
            this._checkStreakBySide = target.checkStreakBySide;
            this._lastCheckSide = target.lastCheckSide !== undefined ? target.lastCheckSide : 0;
            // v1.6.8：与 _applyMove 的新语义保持一致 —— 只读「当前连将方」的计数，
            // 不再取双方最大值（否则悔棋后会把对手的陈旧计数重新抬起来，重现误伤）。
            this._continuousChecks = (XQ.isInCheck(this.board, this.currentPlayer) && this._lastCheckSide)
                ? (this._checkStreakBySide[this._lastCheckSide] || 0)
                : 0;
        }
        this.gameOver = false;
        this.selected = null;
        this.validMoves = [];
        this.hintMove = null;
        this._lastMarksHtml = null;
        this._lastMoveHtml = null;
        this._analysisResults = null;
        this._checkSoundPlayed = false;

        this.render();
        this.updateControlsState();

        if (this.practiceMode) this.updatePracticeUI();

        if (!this.practiceMode) {
            if (this.gameMode === 'pvp') {
                if (undoBy === XQ.RED) this.undoUsedR++; else this.undoUsedB++;
                const left = Math.max(0, 3 - (undoBy === XQ.RED ? this.undoUsedR : this.undoUsedB));
                this.showToast(left > 0 ? ('已悔棋，还剩 ' + left + ' 次') : '已悔棋，次数用完', !isBottom);
            } else {
                this.undoUsed++;
                this.showToast(this.undoLeft() > 0 ? ('已悔棋，本局还剩 ' + this.undoLeft() + ' 次') : '已悔棋，本局次数已用完');
            }
        } else {
            this.showToast('已悔棋（练习模式不限次数）');
        }
        // v1.6.9：悔棋后的盘面也要落存档，否则关掉再开会回到悔棋之前
        this.saveGame();
    }

    undoLimit() {
        if (this.gameMode === 'pvp') return 3;
        const cap = (Number.isFinite(this.undoCap) && this.undoCap > 0) ? this.undoCap : (UNDO_LIMITS[this.difficulty] || 3);
        return cap;
    }
    undoLeft() {
        if (this.gameMode === 'pvp') {
            const used = this.currentPlayer === XQ.RED ? this.undoUsedR : this.undoUsedB;
            return Math.max(0, 3 - used);
        }
        return Math.max(0, this.undoLimit() - this.undoUsed);
    }

    updateControlsState() {
        if (this.resignBtn) {
            this.resignBtn.disabled = this.gameOver;
            this.resignBtn.textContent = this.practiceMode ? '放弃本题' : '认输';
        }
        if (this.newGameBtn) this.newGameBtn.textContent = this.practiceMode ? '重开本题' : '新对局';
        if (this.difficultyLabelEl) this.difficultyLabelEl.textContent = this.practiceMode ? '对手强度' : '难度';

        if (this.undoBtn) {
            const noSteps = this.historyStack.length === 0;
            const mine = this.gameMode === 'pvp' ? this.getBottomColor() : this.playerColorValue();
            const left = this.gameMode === 'pvp'
                ? 3 - (mine === XQ.RED ? this.undoUsedR : this.undoUsedB)
                : (this.practiceMode ? Infinity : this.undoLeft());
            const notMyTurn = this.gameMode === 'pvp' && this.currentPlayer === mine;
            // v1.6.6：人机模式执黑时，红方刚走完第一步 → 玩家还没有自己的棋可悔，
            // 按钮应直接置灰，而不是"可点但点了被 undoMove 拒绝"（状态与行为不一致）。
            const noMineYet = this.gameMode === 'pvc' && this.playerColor === 'b' && this.moveTexts.length <= 1;
            this.undoBtn.disabled = this.gameOver || noSteps || left <= 0 || notMyTurn || noMineYet;
            this.undoBtn.textContent = '悔棋';
        }
        // 双人模式：对方（棋盘上方那方）悔棋按钮，同样按对方剩余次数+可悔判定 disable
        if (this.oppUndoBtnEl) {
            const topColor = this.getTopColor();
            const topLeft = 3 - (topColor === XQ.RED ? this.undoUsedR : this.undoUsedB);
            const oppNoSteps = this.historyStack.length === 0;
            const oppNotTheirTurn = this.gameMode === 'pvp' && this.currentPlayer === topColor;
            this.oppUndoBtnEl.disabled = this.gameOver || oppNoSteps || topLeft <= 0 || oppNotTheirTurn;
        }
        if (this.stopAIBtn) {
            this.stopAIBtn.disabled = this.gameOver || this.practiceMode;
            this.stopAIBtn.style.opacity = this.practiceMode ? '0.45' : '';
            if (!this.practiceMode) {
                this.stopAIBtn.textContent = (this.gameMode === 'pvp') ? '人机模式' : '双人模式';
            }
        }
        // 双人模式：给 body 加 pvp 类，让 CSS 隐藏难度档
        document.body.classList.toggle('pvp', this.gameMode === 'pvp');
    }

    /* ===================== 模式 / 认输 / 新局 ===================== */
    confirmNewGame() {
        if (this.practiceMode) { this.startPractice(this.practiceIndex); return; }
        this.showModal('新对局', '确定要开始一局新对局吗？当前对局进度将被清除。', 'confirm',
            () => this.newGame(), '继续');
    }

    newGame(silent) {
        if (this.practiceMode) { this.startPractice(this.practiceIndex); return; }

        if (this._analysisRunning) this._stopAnalysis();
        this._analysisResults = null;

        this.undoUsed = 0;
        this.undoCap = this.gameMode === 'pvp' ? 3 : (UNDO_LIMITS[this.difficulty] || 3);
        this.undoUsedR = 0;
        this.undoUsedB = 0;

        this.animationToken++;
        if (this.aiTimer) { clearTimeout(this.aiTimer); this.aiTimer = null; }
        if (this.aiFrame) { cancelAnimationFrame(this.aiFrame); this.aiFrame = null; }
        this._aiGen++;
        this.isThinking = false;
        this.isAnimating = false;
        this.boardWrapper.querySelectorAll('.animating-piece').forEach(el => el.remove());

        if (this.gameMode === 'pvc') {
            this.playerColor = this.colorPreference === 'x'
                ? (Math.random() < 0.5 ? 'r' : 'b')
                : this.colorPreference;
        } else {
            this.playerColor = 'r';
        }
        this.flipped = (this.gameMode === 'pvc' && this.playerColor === 'b');

        this.board = XQ.createInitialBoard();
        this.currentPlayer = XQ.RED;
        this.selected = null;
        this.validMoves = [];
        this.historyStack = [];
        this.moveTexts = [];
        this.moveRecords = [];
        this.capturedByRed = [];
        this.capturedByBlack = [];
        this.lastMove = null;
        this.positionHistory = [];
        this._continuousChecks = 0;
        this._checkStreakBySide = { 1: 0, '-1': 0 };
        this._lastCheckSide = 0;
        this.gameOver = false;
        this.hintMove = null;
        this.humanMoved = false;
        this._checkSoundPlayed = false;
        this._lastMarksHtml = null;
        this._lastMoveHtml = null;
        this._capTop = null;
        this._capBot = null;

        this.updateColorSliderUI();
        this.updateControlsState();
        this.render();
        this.hideModal();
        if (!silent) this.clearSavedGame();

        if (this.gameMode === 'pvc' && this.currentPlayer === this.aiColorValue()) {
            this.scheduleAI();
        }
    }

    toggleMode() {
        if (this.practiceMode) { this.showToast('练习模式固定为人机对练'); return; }
        const toPvp = this.gameMode === 'pvc';
        this.pendingSwitch = () => {
            this.animationToken++;
            this._aiGen++;
            this.isThinking = false;
            this.isAnimating = false;
            this.boardWrapper.querySelectorAll('.animating-piece').forEach(el => el.remove());
            this.gameMode = toPvp ? 'pvp' : 'pvc';
            this.newGame();   // v1.6.9：切换模式即弃局，连同存档一起作废
            this.showToast(toPvp ? '已切换到双人对战' : '已切换回人机对战');
        };
        this.showModal(toPvp ? '切换到双人对战' : '切换回人机对战',
            toPvp ? '将结束当前人机对局并新开一局双人对战。' : '将结束当前双人对局并新开一局人机对战。',
            'switch');
    }

    resign() {
        if (this.gameOver) return;
        if (this.practiceMode) {
            this.showModal('放弃本题', '确定要放弃当前这道练习题吗？', 'confirm',
                () => this.practiceFinish(false, '已放弃本题，可以再来一次。'));
            return;
        }
        this.showModal('认输', this.gameMode === 'pvp' ? '确定要认输吗？' : '确定要认输吗？（本局判负）',
            'confirm', () => this.doResign(), '继续');
    }

    doResign() {
        if (this.gameOver) return;
        this.animationToken++;
        this._aiGen++;
        this.isThinking = false;
        this.isAnimating = false;
        this.boardWrapper.querySelectorAll('.animating-piece').forEach(el => el.remove());
        this.gameOver = true;
        this.hintMove = null;

        let winner;
        if (this.gameMode === 'pvp') {
            winner = this.currentPlayer === XQ.RED ? '黑方' : '红方';
        } else {
            winner = 'AI（' + (this.playerColor === 'r' ? '黑方' : '红方') + '）';
        }
        this.showModal('认输', winner + '获胜！', 'end');
        SoundManager.playGameEnd();
        this.clearSavedGame();
        this.updateControlsState();
        this.render();
    }

    /* ===================== 颜色切换 ===================== */
    onColorChange(pref) {
        if (this.colorPreference === pref) return;
        this.colorPreference = pref;
        this.savePrefs();
        const canApplyNow = !this.humanMoved && !this.gameOver;
        if (!canApplyNow) {
            this.updateColorSliderUI();
            if (!this.gameOver) this.showColorHint('新颜色将在下一局生效');
            return;
        }
        this.updateColorSliderUI();
        this.newGame();   // v1.6.9：换色重开即弃局，存档一并作废
    }

    showColorHint(text) {
        if (!this.colorSliderHintEl) return;
        this.colorSliderHintEl.textContent = text;
        this.colorSliderHintEl.classList.add('show');
        if (this._colorHintTimer) clearTimeout(this._colorHintTimer);
        this._colorHintTimer = setTimeout(() => this.colorSliderHintEl.classList.remove('show'), 2500);
    }

    /* ===================== 设置 ===================== */
    savePrefs() {
        try {
            localStorage.setItem('xqPrefs', JSON.stringify({
                difficulty: this.difficulty,
                colorPreference: this.colorPreference,
                darkMode: this.darkMode,
                soundOn: this.soundOn,
                showHint: this.hintOn,
                practiceMode: this.practiceMode,
                practiceIndex: this.practiceIndex
            }));
        } catch (e) { /* 忽略 */ }
    }

    applyDisplayPrefs() {
        SoundManager.setMuted(!this.soundOn);
        document.body.classList.toggle('dark', !!this.darkMode);
        document.body.classList.toggle('show-hint', !!this.hintOn);
        document.body.classList.toggle('practice', !!this.practiceMode);
        this.updateSettingsUI();
    }

    updateSettingsUI() {
        const sync = (el, on) => {
            if (!el) return;
            el.classList.toggle('on', !!on);
            el.setAttribute('aria-checked', on ? 'true' : 'false');
        };
        sync(this.switchDarkEl, this.darkMode);
        sync(this.switchSoundEl, this.soundOn);
        sync(this.switchHintEl, this.hintOn);
        sync(this.switchPracticeEl, this.practiceMode);
    }

    openSettings() { if (this.settingsOverlayEl) this.settingsOverlayEl.classList.add('show'); }
    closeSettings() { if (this.settingsOverlayEl) this.settingsOverlayEl.classList.remove('show'); }

    toggleDark() {
        this.darkMode = !this.darkMode;
        this.applyDisplayPrefs();
        this.savePrefs();
        this.showToast(this.darkMode ? '已切换深色模式' : '已切换浅色模式');
    }
    toggleSound() {
        this.soundOn = !this.soundOn;
        SoundManager.setMuted(!this.soundOn);
        this.updateSettingsUI();
        this.savePrefs();
        if (this.soundOn) SoundManager.playMove();
        this.showToast(this.soundOn ? '已开启音效' : '已关闭音效');
    }
    toggleHint() {
        this.hintOn = !this.hintOn;
        this.applyDisplayPrefs();
        this.savePrefs();
        this.showToast(this.hintOn ? '已开启提示按钮' : '已关闭提示按钮');
    }
    togglePractice() {
        this.practiceMode = !this.practiceMode;
        this.applyDisplayPrefs();
        this.savePrefs();
        this.hintMove = null;
        if (this.practiceMode) {
            this.showToast('练习模式已开启');
            this.startPractice(this.practiceIndex);
        } else {
            this.showToast('已退出练习模式');
            this.newGame(true);
        }
    }

    bindLongPress(el, fn, ms) {
        const hold = ms || 600;
        const start = () => {
            this._cancelLongPress();
            this._lpTimer = setTimeout(() => { this._lpTimer = null; fn(); }, hold);
        };
        const cancel = () => this._cancelLongPress();
        el.addEventListener('touchstart', start, { passive: true });
        el.addEventListener('touchend', cancel);
        el.addEventListener('touchcancel', cancel);
        el.addEventListener('touchmove', cancel, { passive: true });
        el.addEventListener('mousedown', start);
        el.addEventListener('mouseup', cancel);
        el.addEventListener('mouseleave', cancel);
        el.addEventListener('contextmenu', (e) => e.preventDefault());
    }
    _cancelLongPress() {
        if (this._lpTimer) { clearTimeout(this._lpTimer); this._lpTimer = null; }
    }

    /* ===================== 提示 ===================== */
    showHint() {
        if (this.gameOver || this.isAnimating || this._hintRunning) return;
        if (this.gameMode === 'pvc' && this.currentPlayer !== this.playerColorValue()) {
            this.showToast('现在轮到对方走棋');
            return;
        }
        if (this.hintMove && this._hintPly === this.moveTexts.length) {
            this.render();
            this.showToast('已标出建议走法');
            return;
        }
        // v1.6.6：练习局优先用预先验证过的"正解首着"（题目数据 best 字段）。
        // 这些首着由真实引擎穷搜确认"在 limit 步内可强制将杀"，比现算搜索更可靠。
        if (this.practiceMode && !this.practiceDone) {
            const ex = PRACTICE_POSITIONS[this.practiceIndex];
            if (ex && ex.best && ex.best.length === 2) {
                const legal = XQ.legalMoves(this.board, this.currentPlayer);
                const hit = legal.find(m => m.from[0] === ex.best[0][0] && m.from[1] === ex.best[0][1]
                                         && m.to[0] === ex.best[1][0] && m.to[1] === ex.best[1][1]);
                if (hit) {
                    this.hintMove = hit;
                    this._hintPly = this.moveTexts.length;
                    this.render();
                    this.showToast('已标出本题正解首着');
                    return;
                }
            }
        }
        this._hintRunning = true;
        if (this.hintBtnEl) this.hintBtnEl.classList.add('busy');
        this.showToast('正在为你思考…');
        const token = this.animationToken;
        const color = this.currentPlayer;
        const finish = (move) => {
            this._hintRunning = false;
            if (this.hintBtnEl) this.hintBtnEl.classList.remove('busy');
            if (token !== this.animationToken) return;
            if (!move) { this.showToast('暂时没有可走的着法'); return; }
            this.hintMove = move;
            this._hintPly = this.moveTexts.length;
            this.render();
            this.showToast('已标出建议走法');
        };
        // v1.6.5：提示搜索走 Worker（思考期间界面不卡）；Worker 不可用回退同步搜索
        // v1.6.5：Worker 超时/异常 → 同步搜索兜底，提示永不卡死
        const avoidKeys = this._avoidKeys();
        const req = XQWorker.findBestMoveAsync({ board: this.board, color: color, level: 3, avoidKeys: avoidKeys });
        if (req) {
            req.then(res => {
                if (res && res.ok) { finish(res.move); return; }
                // 超时/异常兜底：同步搜索
                let move = null;
                try { move = XQ.findBestMove(this.board, color, 3, avoidKeys, 1200); } catch (e) { move = null; }
                finish(move);
            });
        } else {
            setTimeout(() => {
                let move = null;
                try { move = XQ.findBestMove(this.board, color, 3, avoidKeys, 1200); } catch (e) { move = null; }
                finish(move);
            }, 40);
        }
    }

    /* ===================== 弹窗 / Toast ===================== */
    showModal(title, message, mode, confirmFn, cancelText) {
        if (mode === 'end') this.clearSavedGame();
        this.modalTitleEl.textContent = title;
        this.modalMessageEl.textContent = message || '';
        this.pendingConfirm = confirmFn || null;
        this.modalCloseEl.style.display = (mode === 'plain') ? 'inline-block' : 'none';
        this.modalConfirmRowEl.classList.toggle('show', mode === 'confirm');
        const cancelBtn = document.getElementById('modalCancelBtn');
        if (cancelBtn) cancelBtn.textContent = cancelText || '取消';
        this.modalEndRowEl.classList.toggle('show', mode === 'end');
        if (this.modalPracticeRowEl) this.modalPracticeRowEl.classList.toggle('show', mode === 'practice');
        if (this.modalSwitchRowEl) this.modalSwitchRowEl.classList.toggle('show', mode === 'switch');
        if (this.modalPracticeResultEl && mode !== 'practice') {
            this.modalPracticeResultEl.classList.remove('show');
            this.modalPracticeResultEl.innerHTML = '';
            this.modalEl.classList.remove('practice-ok', 'practice-fail');
        }
        this.modalEl.classList.add('show');
    }

    hideModal() {
        this.modalEl.classList.remove('show');
        this.pendingConfirm = null;
    }

    showToast(text, flip, duration) {
        if (!this.toastEl) return;
        this.toastEl.textContent = text;
        this.toastEl.style.top = '';
        this.toastEl.style.bottom = '';
        // 双人模式：提示贴到棋盘边上（各贴自己那一侧）
        if (this.gameMode === 'pvp' && this.boardWrapper) {
            const br = this.boardWrapper.getBoundingClientRect();
            if (flip) this.toastEl.style.top = Math.max(8, Math.round(br.top) - 52) + 'px';
            else this.toastEl.style.top = Math.round(br.bottom) + 10 + 'px';
        }
        this.toastEl.classList.toggle('toast-flip', !!flip);
        this.toastEl.classList.add('show');
        if (this._toastTimer) clearTimeout(this._toastTimer);
        this._toastTimer = setTimeout(() => {
            this.toastEl.classList.remove('show');
            this.toastEl.classList.remove('toast-flip');
        }, duration || 2200);
    }

    /* ===================== 续下存档（v1.6.9） =====================
       原先只有 clearSavedGame()，全项目找不到对应的写入 —— 关掉 App 再打开对局就没了。
       存档时机：每一步走完（含 AI 应招）。clearSavedGame 的场景（新局/认输/切换模式/
       练习模式）依旧让它作废，行为不变。saveGame 内部自带 gameOver / practiceMode 守卫，
       所以紧跟终局判定其后调用也不会把已结束的对局存进去。 */
    saveGame() {
        if (this.practiceMode || this.gameOver) return;
        try {
            localStorage.setItem('xqSavedGame', JSON.stringify({
                v: 1,
                board: this.board,
                currentPlayer: this.currentPlayer,
                playerColor: this.playerColor,
                gameMode: this.gameMode,
                difficulty: this.difficulty,
                flipped: this.flipped,
                moveTexts: this.moveTexts,
                moveRecords: this.moveRecords,
                capturedByRed: this.capturedByRed,
                capturedByBlack: this.capturedByBlack,
                lastMove: this.lastMove,
                positionHistory: this.positionHistory,
                checkStreakBySide: this._checkStreakBySide,
                lastCheckSide: this._lastCheckSide,
                humanMoved: this.humanMoved,
                undoUsed: this.undoUsed,
                undoUsedR: this.undoUsedR,
                undoUsedB: this.undoUsedB,
                undoCap: this.undoCap,
                ts: Date.now()
            }));
        } catch (e) { /* 忽略 */ }
    }

    // 有新存档时恢复对局（返回 true 表示已接管，调用方不要再 newGame）
    loadSavedGame() {
        let d = null;
        try {
            const raw = localStorage.getItem('xqSavedGame');
            if (!raw) return false;
            d = JSON.parse(raw);
        } catch (e) { return false; }
        if (!d || d.v !== 1 || !Array.isArray(d.board) || d.board.length !== 10) return false;
        // 数据体检：整盘必须全是合法格子、双方各有且仅有一个将/帅
        try {
            let redK = 0, blackK = 0;
            for (let r = 0; r < 10; r++) {
                if (!Array.isArray(d.board[r]) || d.board[r].length !== 9) return false;
                for (let c = 0; c < 9; c++) {
                    const p = d.board[r][c];
                    if (!Number.isInteger(p) || p < -7 || p > 7) return false;
                    if (p === XQ.KING) redK++;
                    if (p === -XQ.KING) blackK++;
                }
            }
            if (redK !== 1 || blackK !== 1) return false;
        } catch (e) { return false; }

        this.board = d.board;
        this.currentPlayer = d.currentPlayer === XQ.BLACK ? XQ.BLACK : XQ.RED;
        this.gameMode = d.gameMode === 'pvp' ? 'pvp' : 'pvc';
        this.playerColor = (d.playerColor === 'b' || d.playerColor === 'r') ? d.playerColor : 'r';
        this.difficulty = (d.difficulty >= 1 && d.difficulty <= 3) ? d.difficulty : this.difficulty;
        this.flipped = !!d.flipped;
        this.moveTexts = Array.isArray(d.moveTexts) ? d.moveTexts : [];
        this.moveRecords = Array.isArray(d.moveRecords) ? d.moveRecords : [];
        this.capturedByRed = Array.isArray(d.capturedByRed) ? d.capturedByRed : [];
        this.capturedByBlack = Array.isArray(d.capturedByBlack) ? d.capturedByBlack : [];
        this.lastMove = d.lastMove || null;
        this.positionHistory = Array.isArray(d.positionHistory) ? d.positionHistory : [];
        this._checkStreakBySide = (d.checkStreakBySide && typeof d.checkStreakBySide === 'object')
            ? d.checkStreakBySide : { 1: 0, '-1': 0 };
        this._lastCheckSide = d.lastCheckSide || 0;
        this._continuousChecks = (XQ.isInCheck(this.board, this.currentPlayer) && this._lastCheckSide)
            ? (this._checkStreakBySide[this._lastCheckSide] || 0) : 0;
        this.humanMoved = !!d.humanMoved;
        this.undoUsed = d.undoUsed || 0;
        this.undoUsedR = d.undoUsedR || 0;
        this.undoUsedB = d.undoUsedB || 0;
        this.undoCap = d.undoCap || (UNDO_LIMITS[this.difficulty] || 3);

        // 本局内可悔的步数上限就是刚走完的这盘棋本身（historyStack 不持久化）
        this.historyStack = [];
        // 恢复历史栈的「局面快照」没有意义（没有 undo 可回），但从首局面走一遍代价高；
        // 这里按当前盘面重建一条最小快照，保证悔棋按钮的可用性判定不至于错乱。
        this.selected = null;
        this.validMoves = [];
        this.gameOver = false;
        this.hintMove = null;
        this._lastMarksHtml = null;
        this._lastMoveHtml = null;
        this._analysisResults = null;
        this._checkSoundPlayed = false;
        this.isThinking = false;
        this.isAnimating = false;

        this.updateColorSliderUI();
        this.applyDisplayPrefs();
        this.updateControlsState();
        this.render();
        // 恢复后若轮到 AI 走棋（例如存档停在 AI 回合），接着让它思考
        if (this.gameMode === 'pvc' && this.currentPlayer === this.aiColorValue()) {
            this.scheduleAI();
        }
        return true;
    }

    clearSavedGame() {
        try { localStorage.removeItem('xqSavedGame'); } catch (e) { /* 忽略 */ }
    }

    /* ===================== 练习模式 ===================== */
    startPractice(index) {
        const n = PRACTICE_POSITIONS.length;
        this.practiceIndex = ((index % n) + n) % n;
        const ex = PRACTICE_POSITIONS[this.practiceIndex];

        this.undoUsed = 0;
        this.animationToken++;
        this._aiGen++;
        this.isThinking = false;
        this.isAnimating = false;
        if (this.aiTimer) { clearTimeout(this.aiTimer); this.aiTimer = null; }
        if (this.aiFrame) { cancelAnimationFrame(this.aiFrame); this.aiFrame = null; }
        this.boardWrapper.querySelectorAll('.animating-piece').forEach(el => el.remove());

        const map = { K: XQ.KING, A: XQ.ADVISOR, B: XQ.ELEPHANT, N: XQ.HORSE, R: XQ.CHARIOT, C: XQ.CANNON, P: XQ.PAWN };
        const b = Array.from({ length: 10 }, () => new Array(9).fill(0));
        for (let i = 0; i < ex.pieces.length; i++) {
            const item = ex.pieces[i];
            const ch = String(item[0]).toUpperCase();
            const rr = item[1], cc = item[2];
            if (map[ch] === undefined) continue;
            const isRed = String(item[0]) === ch;
            b[rr][cc] = isRed ? map[ch] : -map[ch];
        }

        this.board = b;
        this.playerColor = ex.player;
        this.flipped = (ex.player === 'b');
        this.currentPlayer = (ex.player === 'r') ? XQ.RED : XQ.BLACK;
        this.selected = null;
        this.validMoves = [];
        this.historyStack = [];
        this.moveTexts = [];
        this.moveRecords = [];
        this.capturedByRed = [];
        this.capturedByBlack = [];
        this.lastMove = null;
        this.positionHistory = [];
        this._continuousChecks = 0;
        this._checkStreakBySide = { 1: 0, '-1': 0 };
        this._lastCheckSide = 0;
        this.gameOver = false;
        this.hintMove = null;
        this.practiceDone = false;
        this.humanMoved = false;
        this._checkSoundPlayed = false;
        this._lastMarksHtml = null;
        this._lastMoveHtml = null;
        this._capTop = null;
        this._capBot = null;
        this._analysisResults = null;
        this.gameMode = 'pvc';

        this.clearSavedGame();
        this.updateControlsState();
        this.updatePracticeUI();
        this.render();
        this.hideModal();

        if (this.currentPlayer === this.aiColorValue()) this.scheduleAI();
    }

    updatePracticeUI() {
        if (!this.practiceBarEl) return;
        const ex = PRACTICE_POSITIONS[this.practiceIndex];
        if (!ex) return;
        const used = this.practiceUsed();
        const inGroup = PRACTICE_POSITIONS.slice(0, this.practiceIndex + 1).filter(e => e.group === ex.group).length;
        const groupTotal = PRACTICE_POSITIONS.filter(e => e.group === ex.group).length;
        this.practiceNameEl.textContent = ex.name + '（你执' + (ex.player === 'r' ? '红' : '黑') + '）';
        this.practiceProgressEl.textContent = '已用 ' + used + ' / ' + ex.limit + ' 步';
        if (this.practiceMetaEl) {
            this.practiceMetaEl.textContent = ex.group + ' ' + inGroup + '/' + groupTotal +
                ' · 全库第 ' + (this.practiceIndex + 1) + '/' + PRACTICE_POSITIONS.length + ' 题';
        }
        this.practiceGoalEl.textContent = ex.goal;
        if (this.practiceFillEl) {
            const pct = Math.min(100, Math.round(used / ex.limit * 100));
            this.practiceFillEl.style.width = pct + '%';
            this.practiceFillEl.classList.toggle('warn', used >= ex.limit - 2);
        }
    }

    practiceFinish(success, detail) {
        if (this.practiceDone) return;
        this.practiceDone = true;
        this.gameOver = true;
        this.isThinking = false;
        this.hintMove = null;
        this.animationToken++;
        this._aiGen++;
        if (this.aiTimer) { clearTimeout(this.aiTimer); this.aiTimer = null; }
        if (this.aiFrame) { cancelAnimationFrame(this.aiFrame); this.aiFrame = null; }
        this.boardWrapper.querySelectorAll('.animating-piece').forEach(el => el.remove());
        this.clearSavedGame();
        this.updatePracticeUI();
        this.updateControlsState();
        this.render();
        SoundManager.playGameEnd();

        const ex = PRACTICE_POSITIONS[this.practiceIndex];
        const used = this.practiceUsed();
        this.showPracticeResult(success, ex, used, detail || '');
    }

    showPracticeResult(success, ex, used, detail) {
        this.showModal(success ? '完成！' : '未完成', '', 'practice');
        this.modalEl.classList.toggle('practice-ok', !!success);
        this.modalEl.classList.toggle('practice-fail', !success);
        const el = this.modalPracticeResultEl;
        if (!el) return;
        el.innerHTML =
            '<div class="pr-name">「' + ex.name + '」</div>' +
            '<div class="pr-steps"><span class="pr-num">' + used + '</span><span class="pr-unit">步</span>' +
            '<span class="pr-limit">上限 ' + ex.limit + ' 步</span></div>' +
            (detail ? '<div class="pr-note">' + detail + '</div>' : '');
        el.classList.toggle('fail', !success);
        el.classList.add('show');
    }

    openPracticePicker() {
        this.buildPracticePicker();
        if (this.practicePickerEl) this.practicePickerEl.classList.add('show');
    }
    closePracticePicker() {
        if (this.practicePickerEl) this.practicePickerEl.classList.remove('show');
    }
    buildPracticePicker() {
        if (!this.practicePickerListEl) return;
        const tag = (ex) => {
            if (ex.win === 'promote') return '升变 · ' + ex.limit + ' 步内';
            if (ex.limit <= 3) return ex.limit + ' 步杀';
            return '将杀 · ' + ex.limit + ' 步内';
        };
        let html = '', lastGroup = null;
        PRACTICE_POSITIONS.forEach((ex, i) => {
            if (ex.group !== lastGroup) {
                lastGroup = ex.group;
                html += '<div class="picker-group">' + ex.group + '</div>';
            }
            html += '<button class="picker-item' + (i === this.practiceIndex ? ' cur' : '') + '" data-idx="' + i + '">' +
                '<span class="picker-no">' + (i + 1) + '</span>' +
                '<span class="picker-name">' + ex.name + '</span>' +
                '<span class="picker-tag">' + tag(ex) + '</span></button>';
        });
        this.practicePickerListEl.innerHTML = html;
        if (this.practicePickerSubEl) this.practicePickerSubEl.textContent = '共 ' + PRACTICE_POSITIONS.length + ' 题';
        const cur = this.practicePickerListEl.querySelector('.picker-item.cur');
        if (cur) this.practicePickerListEl.scrollTop = Math.max(0, cur.offsetTop - 60);
    }

    /* ===================== 复盘 ===================== */
    _stopAnalysis() {
        this._analysisRunning = false;
        if (this.modalAnalysisBtnEl) {
            this.modalAnalysisBtnEl.textContent = '复盘';
            this.modalAnalysisBtnEl.classList.remove('danger');
        }
        this.render();
    }

    _showAnalysisForPly(ply) {
        if (!this._analysisResults) return;
        const r = this._analysisResults.find(x => x.ply === ply);
        if (!r) return;
        const icon = r.grade === 'good' ? '✅' : (r.grade === 'q' ? '⚠️' : '❌');
        const label = r.grade === 'good' ? '好棋' : (r.grade === 'q' ? '疑问手' : '失误');
        const best = r.best ? (' · 建议：' + r.best) : '';
        this.showToast(icon + ' ' + r.text + ' → ' + label + '\n偏差 ' + Math.round(r.dev) + best, false, 4000);
    }
}

/* ===================== 复盘分析 ===================== */
function analysisEval(board, color, depth, alpha, beta) {
    // v1.6.5：加入 alpha-beta 剪枝（旧版是纯 minimax，全量遍历所有着法，深一层慢一个数量级）
    if (alpha === undefined) alpha = -Infinity;
    if (beta === undefined) beta = Infinity;
    if (depth <= 0) return XQ.evaluate(board);
    const moves = XQ.legalMoves(board, color);
    if (moves.length === 0) return color === XQ.RED ? -XQ.MATE : XQ.MATE;
    // v1.6.5：吃子排序按被吃子真实价值（旧版 Math.abs(captured) 是棋子类型编号 1~7，排序基准是错的）
    moves.sort((a, b) => {
        const sa = a.captured ? (XQ.VALUES[XQ.getType(a.captured)] || 0) : 0;
        const sb = b.captured ? (XQ.VALUES[XQ.getType(b.captured)] || 0) : 0;
        return sb - sa;
    });
    if (color === XQ.RED) {
        let best = -Infinity;
        for (let i = 0; i < moves.length; i++) {
            const m = moves[i];
            const cap = XQ.makeMove(board, m);
            const v = analysisEval(board, -color, depth - 1, alpha, beta);
            XQ.unmakeMove(board, m, cap);
            if (v > best) best = v;
            if (best > alpha) alpha = best;
            if (alpha >= beta) break;
        }
        return best;
    } else {
        let best = Infinity;
        for (let i = 0; i < moves.length; i++) {
            const m = moves[i];
            const cap = XQ.makeMove(board, m);
            const v = analysisEval(board, -color, depth - 1, alpha, beta);
            XQ.unmakeMove(board, m, cap);
            if (v < best) best = v;
            if (best < beta) beta = best;
            if (alpha >= beta) break;
        }
        return best;
    }
}

function startAnalysis(g) {
    if (!g.gameOver) { g.showToast('对局结束后才能复盘'); return; }
    if (g.moveTexts.length < 2) { g.showToast('对局太短，无法分析'); return; }
    if (g._analysisRunning) { g._stopAnalysis(); return; }

    g._analysisRunning = true;
    g._analysisResults = [];
    g._analysisPly = 0;
    g.selected = null;
    g.validMoves = [];
    g.showToast('正在复盘分析…');
    if (g.modalAnalysisBtnEl) {
        g.modalAnalysisBtnEl.textContent = '停止';
        g.modalAnalysisBtnEl.classList.add('danger');
    }

    // v1.6.6 修正：快照数组的第 i 项必须是"第 i 手走之前"的局面。
    // 旧实现前面多塞了一个初始局面（snapshots = [初始] + historyStack + [终局]），
    // 却仍按 snapshots[i] 取用，于是从第 2 手起全部错位一格——用的是上一手之前的
    // 局面，连"把实际着法落子到该局面"都可能落成非法手（起点无子/吃己方子），
    // 导致复盘给出的"失误/疑问手"评分和"建议着法"整体不可信（已实测复现）。
    // historyStack[i] 正是第 i 手走之前的局面（含轮到谁走），直接对齐即可。
    const snapshots = [];
    for (let i = 0; i < g.historyStack.length; i++) {
        const h = g.historyStack[i];
        snapshots.push({ board: XQ.cloneBoard(h.board), currentPlayer: h.currentPlayer });
    }
    // 兜底：若存在 moveRecords 比 historyStack 长的情况（异常存档等），用终局局面补齐，
    // 保证 snapshots[i] 不会 undefined（step 里另有 snap && rec 守卫）。
    snapshots.push({ board: XQ.cloneBoard(g.board), currentPlayer: g.currentPlayer });

    const step = () => {
        if (!g._analysisRunning) return;
        if (g._analysisPly >= g.moveRecords.length) {
            finishAnalysis(g);
            return;
        }
        const i = g._analysisPly;
        const rec = g.moveRecords[i];
        const snap = snapshots[i];
        if (snap && rec) {
            const mover = snap.currentPlayer;
            const work = XQ.cloneBoard(snap.board);
            let bestScore = mover === XQ.RED ? -Infinity : Infinity;
            let bestMove = null;
            const legal = XQ.legalMoves(work, mover);
            for (let k = 0; k < legal.length; k++) {
                const m = legal[k];
                const cap = XQ.makeMove(work, m);
                const v = analysisEval(work, -mover, 2);
                XQ.unmakeMove(work, m, cap);
                if (mover === XQ.RED ? (v > bestScore) : (v < bestScore)) {
                    bestScore = v; bestMove = m;
                }
            }
            let actualScore;
            const work2 = XQ.cloneBoard(snap.board);
            const cap2 = XQ.makeMove(work2, rec);
            actualScore = analysisEval(work2, -mover, 2);
            XQ.unmakeMove(work2, rec, cap2);
            // v1.6.6 一致性校验：错位修正后，实际着法必须落在合法着法列表里。
            // 若不合法（理论上不该发生），标记为无法评估，而不是拿错误分数给出"失误"结论。
            const wasLegal = legal.some(m => m.from[0] === rec.from[0] && m.from[1] === rec.from[1]
                                          && m.to[0] === rec.to[0] && m.to[1] === rec.to[1]);
            if (!wasLegal) {
                g._analysisResults.push({
                    ply: i, text: rec.text, dev: 0, grade: 'good',
                    best: '', from: rec.from, to: rec.to, note: '局面快照异常，跳过评估'
                });
                g._analysisPly++;
                setTimeout(step, 0);
                return;
            }

            const dev = Math.abs(actualScore - bestScore);
            let grade = 'good';
            if (dev > 400) grade = 'bad';
            else if (dev > 120) grade = 'q';

            let bestText = '';
            if (bestMove && grade !== 'good') {
                bestText = PIECE_CHARS[bestMove.piece] +
                    ' ' + FILES[bestMove.from[1]] + (10 - bestMove.from[0]) +
                    '→' + FILES[bestMove.to[1]] + (10 - bestMove.to[0]);
            }
            g._analysisResults.push({
                ply: i, text: rec.text, dev: dev, grade: grade,
                best: bestText, from: rec.from, to: rec.to
            });
        }
        g._analysisPly++;
        setTimeout(step, 0);
    };
    setTimeout(step, 60);
}

function finishAnalysis(g) {
    g._analysisRunning = false;
    if (g.modalAnalysisBtnEl) {
        g.modalAnalysisBtnEl.textContent = '复盘';
        g.modalAnalysisBtnEl.classList.remove('danger');
    }
    if (g.moveHistoryEl && g.moveHistoryEl.classList.contains('collapsed')) {
        g.moveHistoryEl.classList.remove('collapsed');
    }
    const r = g._analysisResults || [];
    const good = r.filter(x => x.grade === 'good').length;
    const q = r.filter(x => x.grade === 'q').length;
    const bad = r.filter(x => x.grade === 'bad').length;
    g.showModal('复盘分析完成',
        '共 ' + r.length + ' 步分析结果：\n✅ 好棋 ' + good + '\n⚠️ 疑问手 ' + q + '\n❌ 失误 ' + bad +
        '\n\n点击走棋记录可查看每步详情', 'plain');
    g.render();
}

            game.closeSettings();
            return 'handled';
        }
        if (game.modalEl && game.modalEl.classList.contains('show')) {
            game.hideModal();
            return 'handled';
        }
    } catch (e) { /* 忽略 */ }
    return 'exit';
};
</script>
