    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body { font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif; background:#f3e8d4; color:#2b2316; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:16px 12px; }
    .header { margin-bottom:12px; display:flex; align-items:center; gap:12px; -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }
    .header h1 { font-size:1.5rem; font-weight:600; }
    .game-container { width:100%; max-width:500px; display:flex; flex-direction:column; gap:6px; }

    .status-bar { background:#fff; border-radius:20px; padding:7px 14px; box-shadow:0 2px 8px rgba(0,0,0,0.06); display:flex; align-items:center; justify-content:space-between; min-height:40px; transition:background .2s; }
    .status-bar.check-alert { background:#fff0f0; box-shadow:0 0 12px rgba(255,0,0,0.2); }
    .status-left { display:flex; align-items:center; gap:10px; }
    .turn-indicator { width:14px; height:14px; border-radius:50%; border:2px solid #ccc; flex-shrink:0; transition:background .2s; }
    .turn-indicator.red { background:#c0392b; border-color:#8e2b1f; }
    .turn-indicator.black { background:#1f2937; border-color:#555; }
    .status-text { font-weight:500; font-size:.92rem; }
    .status-right { display:flex; align-items:center; gap:10px; flex-wrap:nowrap; white-space:nowrap; }
    .eval-score { font-size:.82rem; color:#6b7280; background:#f3f4f6; padding:2px 10px; border-radius:12px; flex-shrink:0; }
    .thinking-indicator { display:none; align-items:center; gap:6px; color:#c9962f; font-weight:500; flex-shrink:0; font-size:.85rem; }
    .thinking-indicator.show { display:flex; }
    .thinking-dots span { display:inline-block; width:7px; height:7px; background:#c9962f; border-radius:50%; animation:dotBounce 1.2s infinite ease-in-out; }
    .thinking-dots span:nth-child(2) { animation-delay:-0.2s; }
    .thinking-dots span:nth-child(3) { animation-delay:-0.4s; }
    @keyframes dotBounce { 0%,80%,100% { transform:scale(.6); opacity:.5; } 40% { transform:scale(1); opacity:1; } }

    /* ===== 棋盘 ===== */
    .board-frame { position:relative; width:100%; }
    .board-wrapper {
        position:relative; width:100%;
        aspect-ratio: 9 / 10;
        border-radius:12px;
        background:
            radial-gradient(ellipse at 30% 20%, rgba(255,255,255,.55), transparent 60%),
            linear-gradient(135deg, #f3dcae 0%, #eccf95 45%, #e2c07f 100%);
        box-shadow:0 8px 30px rgba(0,0,0,.14), inset 0 0 0 1px rgba(120,80,30,.25);
        overflow:hidden;
        touch-action: manipulation;
        --cell: 44px;
    }
    .board-svg { position:absolute; inset:0; width:100%; height:100%; display:block; }
    .board-svg line, .board-svg rect, .board-svg path { stroke:#7a5a2e; stroke-width:.035; stroke-linecap:round; fill:none; }
    .board-svg .frame { stroke-width:.07; }
    .board-svg text.river-text { fill:#8a6a3a; font-size:.78px; font-weight:700; letter-spacing:.16em;
        font-family:"STKaiti","KaiTi","Songti SC",serif; }
    .board-svg .mark { fill:#7a5a2e; stroke:none; }

    .check-glow { position:absolute; top:0; left:0; width:100%; height:100%; border-radius:12px;
        pointer-events:none; z-index:30; opacity:0; transition:opacity .25s ease;
        box-shadow:0 0 18px 4px rgba(255,45,45,.55), 0 0 38px 14px rgba(255,45,45,.30); }
    body.dark .check-glow { box-shadow:0 0 18px 4px rgba(255,60,60,.62), 0 0 38px 14px rgba(255,60,60,.36); }
    .board-frame.checking .check-glow { opacity:1; animation:checkGlowPulse 1.1s ease-in-out infinite; }
    @keyframes checkGlowPulse { 0%,100% { opacity:.82; } 50% { opacity:1; } }

    .marks-layer, .pieces-layer { position:absolute; inset:0; }
    .marks-layer { pointer-events:none; z-index:5; }
    .pieces-layer { z-index:10; }

    .mark-dot { position:absolute; width:calc(var(--cell)*.28); height:calc(var(--cell)*.28);
        border-radius:50%; background:rgba(20,60,20,.28); transform:translate(-50%,-50%); }
    .mark-ring { position:absolute; width:calc(var(--cell)*.92); height:calc(var(--cell)*.92);
        border-radius:50%; border:3px solid rgba(220,60,40,.75); transform:translate(-50%,-50%);
        box-shadow:0 0 10px rgba(220,60,40,.5); }
    .mark-capture { position:absolute; width:calc(var(--cell)*.96); height:calc(var(--cell)*.96);
        border-radius:50%; border:3px dashed rgba(200,40,30,.8); transform:translate(-50%,-50%); }
    .mark-last { position:absolute; width:calc(var(--cell)*.95); height:calc(var(--cell)*.95);
        border-radius:8px; border:2px solid rgba(40,120,60,.55); transform:translate(-50%,-50%); }

    .xq-piece {
        position:absolute;
        width:calc(var(--cell) * .9);
        height:calc(var(--cell) * .9);
        border-radius:50%;
        display:flex; align-items:center; justify-content:center;
        font-family:"XQKaiti","STKaiti","KaiTi","Songti SC","SimSun",serif;
        font-weight:700;
        font-size:calc(var(--cell) * .54);
        line-height:1;
        cursor:pointer;
        user-select:none;
        z-index:10;
        box-shadow:0 2px 5px rgba(0,0,0,.28);
        transition:box-shadow .18s;
    }
    .xq-piece.red {
        color:#b3221c;
        background:radial-gradient(circle at 34% 28%, #fffdf6 0%, #fdf1d6 42%, #e8cf9d 100%);
        border:2px solid #a97c46;
        box-shadow:0 2px 5px rgba(80,50,10,.35), inset 0 0 0 2px rgba(255,255,255,.55), inset 0 -3px 6px rgba(160,120,60,.28);
    }
    .xq-piece.black {
        color:#1b1b1b;
        background:radial-gradient(circle at 34% 28%, #fffdf6 0%, #fdf1d6 42%, #e8cf9d 100%);
        border:2px solid #6b5228;
        box-shadow:0 2px 5px rgba(80,50,10,.35), inset 0 0 0 2px rgba(255,255,255,.55), inset 0 -3px 6px rgba(160,120,60,.28);
    }
    .xq-piece.selected { box-shadow:0 0 0 3px #f6c344, 0 6px 16px rgba(246,195,68,.5); }
    .xq-piece.frozen { cursor:default; }
    .xq-glyph { display:block; transform:translate(-1.5px,-1.5px); }
    /* 双人模式：棋盘上方一方的棋子旋转 180° —— 使用独立 rotate 属性，不与 transform 冲突 */
    .xq-glyph.piece-rotated { rotate: 180deg; }

    /* 动画棋子：单独一层，绝对定位，走位用 left/top 过渡 */
    .animating-piece {
        pointer-events: none !important;
        z-index: 60 !important;
        cursor: default !important;
        transition: left .32s cubic-bezier(.2,0,.2,1), top .32s cubic-bezier(.2,0,.2,1) !important;
    }
    /* AI 走子专用缓动：玩家保持原手感(0.2,0,0.2,1 / 0.32s)，仅 AI 走子用更柔和的缓入缓出 */
    .animating-piece.ai-anim {
        transition: left .38s cubic-bezier(.42,0,.58,1), top .38s cubic-bezier(.42,0,.58,1) !important;
    }

    .captured-pieces { display:flex; gap:3px; height:26px; flex-wrap:nowrap; overflow:hidden; justify-content:center; align-items:center; padding:0; }
    .cap-piece {
        display:inline-flex; align-items:center; justify-content:center;
        width:22px; height:22px; border-radius:50%;
        font-family:"XQKaiti","STKaiti","KaiTi",serif; font-size:13px; font-weight:700;
        background:#f5e6c8; border:1px solid #c0a068;
        opacity:.82; animation:pieceAppear .18s ease;
    }
    .cap-piece.red { color:#b3221c; }
    .cap-piece.black { color:#1b1b1b; }
    @keyframes pieceAppear { from { opacity:0; transform:translateY(-6px); } to { opacity:.82; transform:translateY(0); } }

    .controls { display:flex; flex-direction:column; gap:10px; }
    .control-row { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; align-items:center; }
    .control-row .btn { padding:10px 14px; }
    @media (max-width:400px) { .control-row .btn { padding:8px 12px; } }
    .btn { border:none; border-radius:14px; padding:10px 16px; font-size:.9rem; font-weight:600; cursor:pointer;
        transition:all .15s; background:#e5e7eb; color:#1f2937; touch-action:manipulation; font-family:inherit; }
    .btn:hover { background:#d1d5db; transform:translateY(-1px); }
    .btn:active { transform:scale(.96); }
    .btn.primary { background:#c9962f; color:#fff; }
    .btn.primary:hover { background:#b3872a; }
    .btn.danger { background:#ff5858; color:#fff; }
    .btn.danger:hover { background:#e84848; }
    .btn:disabled { opacity:.45; cursor:not-allowed; }
    .btn:disabled:hover { background:#e5e7eb; transform:none; }
    .btn.danger:disabled:hover { background:#ff5858; }

    /* ===== 5.2.9 定稿：双人面对面，两人各看自己那一侧 =====
       双人模式：棋盘下方(己方) 一方棋子正向；棋盘上方(对方) 一方棋子倒置 180°。
       用 .xq-glyph.piece-rotated 实现（rotate 独立属性，不占用 transform）。 */
    body.pvp .xq-glyph.piece-rotated { rotate: 180deg; }

    /* ===== 双人模式：对方（棋盘上方那方）倒置悔棋按钮 ===== */
    .opp-undo-row { display:none; justify-content:center; padding:4px 0; }
    body.pvp .opp-undo-row { display:flex; }
    .btn.opp-undo { rotate:180deg; display:inline-flex; align-items:center; gap:4px; opacity:0.92; }
    .btn.opp-undo:disabled { rotate:180deg; opacity:0.45; cursor:not-allowed; }
    .btn.opp-undo:active { transform:scale(0.96); }
    @supports not (rotate:180deg) {
        .btn.opp-undo { transform:rotate(180deg); }
        .btn.opp-undo:hover { transform:rotate(180deg) translateY(-1px); }
        .btn.opp-undo:active { transform:rotate(180deg) scale(0.96); }
        .btn.opp-undo:disabled:hover { transform:rotate(180deg); }
    }

    .difficulty-selector { display:flex; gap:4px; flex-wrap:wrap; justify-content:center; align-items:center; }
    body.pvp #difficultyLabel, body.pvp .difficulty-btn { display:none !important; }
    .difficulty-selector label { font-size:.85rem; color:#4b5563; margin-right:4px; }
    .difficulty-btn { border:1px solid #d1d5db; background:#fff; padding:4px 9px; min-height:30px; font-size:.8rem;
        border-radius:10px; cursor:pointer; transition:all .15s; font-family:inherit; }
    .difficulty-btn.active { background:#c9962f; color:#fff; border-color:#c9962f; }
    .difficulty-btn:hover:not(.active) { background:#f3f4f6; }

    /* ===== 练习模式：棋盘下方按钮的显示/隐藏 ===== */
    #practicePickBtn { display:none; }
    body.practice #stopAIBtn { display:none; }
    body.practice #practicePickBtn { display:inline-block; }

    .color-slider-wrap { display:flex; flex-direction:column; align-items:center; gap:2px; }
    .color-slider { position:relative; display:flex; width:100%; max-width:300px; background:#e5e7eb; padding:2px;
        border-radius:999px; box-shadow:inset 0 1px 3px rgba(0,0,0,.08); }
    .color-slider-thumb { position:absolute; top:2px; bottom:2px; left:2px; width:calc((100% - 6px)/3);
        background:#c9962f; border-radius:999px; box-shadow:0 2px 8px rgba(201,150,47,.4);
        transition:transform .28s cubic-bezier(.25,.1,.25,1); }
    .color-slider-opt { flex:1; position:relative; z-index:2; display:flex; align-items:center; justify-content:center;
        gap:6px; min-height:32px; padding:3px 4px; border:none; background:transparent; border-radius:999px;
        font-size:.85rem; font-weight:600; color:#6b7280; cursor:pointer; transition:color .2s; font-family:inherit; }
    .color-slider-opt.active { color:#fff; }
    .color-slider-opt:not(.active):hover { color:#1f2937; }
    .color-slider-icon { font-size:1.1rem; line-height:1; }
    .color-slider-hint { height:16px; font-size:.75rem; color:#d97706; opacity:0; transition:opacity .2s; }
    .color-slider-hint.show { opacity:1; }

    .move-history { background:#fff; border-radius:16px; padding:6px 14px; box-shadow:0 2px 8px rgba(0,0,0,.06); overflow:hidden; }
    .move-history-title { font-size:.68rem; color:#6b7280; margin-bottom:2px; cursor:pointer; user-select:none;
        display:flex; align-items:center; justify-content:space-between; gap:4px; }
    .move-history-arrow { display:inline-block; font-size:1.7rem; line-height:1; color:#374151; transition:transform .2s; }
    .move-history.collapsed .move-history-arrow { transform:rotate(90deg); }
    .move-list { display:flex; flex-wrap:wrap; gap:3px 7px; max-height:84px; overflow-y:auto;
        transition:max-height .2s, opacity .2s, margin .2s; }
    .move-history.collapsed .move-list { max-height:0; opacity:0; margin-top:0; overflow:hidden; }
    .move-entry { background:#f3f4f6; padding:1px 7px; border-radius:8px; font-family:monospace; font-size:.74rem;
        animation:moveFade .18s ease; }
    @keyframes moveFade { from { opacity:0; transform:translateX(-6px); } to { opacity:1; transform:translateX(0); } }
    .move-entry.cur { background:#c9962f; color:#fff; }

    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.4); display:none; align-items:center;
        justify-content:center; z-index:100; padding:20px; }
    .modal-overlay.show { display:flex; }
    .modal { background:#fff; border-radius:24px; padding:28px 24px; width:90%; max-width:320px;
        box-shadow:0 8px 24px rgba(0,0,0,.15); animation:modalPop .18s ease; text-align:center; }
    @keyframes modalPop { from { transform:scale(.92); opacity:0; } to { transform:scale(1); opacity:1; } }
    .modal h2 { font-size:1.3rem; margin-bottom:8px; }
    .modal p { color:#6b7280; margin-bottom:16px; white-space:pre-line; font-size:.9rem; line-height:1.6; }
    .modal-close { margin-top:12px; width:100%; }
    .modal-btn-row { display:none; gap:10px; margin-top:14px; }
    .modal-btn-row.show { display:flex; }
    .modal-btn-row .btn { flex:1; padding:11px 10px; }
    /* 双人模式：对方（棋盘上方那方）走子/升变等弹窗整体翻转 180°（与悔棋按钮同侧翻转规则） */
    .modal.promo-flip { rotate: 180deg; }
    @supports not (rotate:180deg) {
        .modal.promo-flip { transform:rotate(180deg); }
    }

    .toast { position:fixed; left:50%; top:14px; transform:translateX(-50%) translateY(-8px);
        background:rgba(255,255,255,.97); color:#1f2937; border:1px solid rgba(31,41,55,.10);
        box-shadow:0 6px 18px rgba(0,0,0,.16); padding:10px 18px; border-radius:14px; font-size:.85rem;
        font-weight:500; opacity:0; pointer-events:none; transition:opacity .25s; z-index:300;
        max-width:88vw; text-align:center; white-space:pre-line; }
    .toast.show { opacity:1; }
    /* 双人模式提示：对方侧的提示倒置 180°。
       必须把 translateX 和 rotate 写进同一 transform（translateX(-50%) 在前居中定位，
       rotate 绕自身中心翻转），绝不能叠加独立 rotate 属性——否则会和基础的
       translateY(-8px) 组合成 translateY 先移 + rotate 后转，旋转后 -8px 反向后，
       对方提示会明显上下位移。 */
    .toast.toast-flip { transform: translateX(-50%) rotate(180deg); }
    @supports not (rotate: 180deg) {
        .toast.toast-flip { transform: translateX(-50%) rotate(180deg); }
    }

    .settings-overlay { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none;
        align-items:center; justify-content:center; z-index:400; padding:20px; }
    .settings-overlay.show { display:flex; }
    .settings-panel { background:#fff; border-radius:20px; padding:18px 18px 14px; width:100%; max-width:320px;
        box-shadow:0 10px 30px rgba(0,0,0,.22); animation:modalPop .18s ease; }
    .settings-head h2 { font-size:.95rem; font-weight:600; }
    .settings-sub { font-size:.64rem; color:#9ca3af; margin-bottom:9px; }
    .settings-row { display:flex; align-items:center; justify-content:space-between; gap:10px;
        padding:13px 2px; border-top:1px solid #f1f5f9; }
    .settings-row:first-of-type { border-top:none; }
    .settings-row-label { font-size:.85rem; color:#374151; }
    .switch { position:relative; width:40px; height:23px; flex-shrink:0; border:none; border-radius:999px;
        background:#d1d5db; cursor:pointer; transition:background .2s; padding:0; }
    .switch .knob { position:absolute; top:2px; left:2px; width:19px; height:19px; border-radius:50%;
        background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.28); transition:transform .2s; }
    .switch.on { background:#c9962f; }
    .switch.on .knob { transform:translateX(17px); }
    .settings-author { margin-top:10px; padding-top:8px; text-align:center; font-size:.7rem; color:#9ca3af; }
    .settings-close { margin-top:12px; width:100%; }

    /* 深色模式 */
    body.dark { background:#22303f; color:#e6ebf2; }
    body.dark .status-bar { background:#2b3a4b; box-shadow:0 2px 8px rgba(0,0,0,.35); }
    body.dark .status-bar.check-alert { background:#4a2b30; }
    body.dark .eval-score { background:#354657; color:#a9b6c6; }
    body.dark .btn { background:#354657; color:#e6ebf2; }
    body.dark .btn:hover { background:#3e5162; }
    body.dark .btn:disabled:hover { background:#354657; }
    body.dark .difficulty-selector label { color:#a9b6c6; }
    body.dark .difficulty-btn:not(.active) { background:#2b3a4b; border-color:#3e5162; color:#cfd9e4; }
    body.dark .difficulty-btn:hover:not(.active) { background:#354657; }
    body.dark .move-history { background:#2b3a4b; box-shadow:0 2px 8px rgba(0,0,0,.35); }
    body.dark .move-history-title { color:#a9b6c6; }
    body.dark .move-history-arrow { color:#cfd9e4; }
    body.dark .move-entry { background:#354657; color:#cfd9e4; }
    body.dark .move-entry.cur { background:#c9962f; color:#fff; }
    body.dark .color-slider { background:#354657; }
    body.dark .color-slider-opt:not(.active) { color:#a9b6c6; }
    body.dark .color-slider-opt:not(.active):hover { color:#e6ebf2; }
    body.dark .header h1 { color:#e6ebf2; }
    body.dark .modal, body.dark .settings-panel { background:#2b3a4b; color:#e6ebf2; }
    body.dark .modal p { color:#a9b6c6; }
    body.dark .settings-row { border-top-color:#354657; }
    body.dark .settings-row-label { color:#cfd9e4; }
    body.dark .switch:not(.on) { background:#3e5162; }
    body.dark .toast { background:rgba(43,58,75,.97); color:#e6ebf2; border:1px solid rgba(255,255,255,.14); }
    body.dark .board-wrapper {
        background:
            radial-gradient(ellipse at 30% 20%, rgba(255,255,255,.10), transparent 60%),
            linear-gradient(135deg, #6b5a3c 0%, #5e4e33 45%, #524428 100%);
        box-shadow:0 8px 30px rgba(0,0,0,.5), inset 0 0 0 1px rgba(0,0,0,.4);
    }
    body.dark .board-svg line, body.dark .board-svg rect, body.dark .board-svg path { stroke:#d9c39a; }
    body.dark .board-svg text.river-text { fill:#d9c39a; }
    body.dark .board-svg .mark { fill:#d9c39a; }
    body.dark .cap-piece { background:#4a3c22; border-color:#7c6435; }
    body.dark .cap-piece.red { color:#e0483f; }
    body.dark .cap-piece.black { color:#ddd; }

    .hint-btn { position:relative; width:32px; height:32px; border-radius:50%; flex-shrink:0;
        border:none; margin-left:6px; background:rgba(255,255,255,.95); box-shadow:0 2px 6px rgba(0,0,0,.22);
        line-height:0; cursor:pointer; z-index:6; display:none; align-items:center; justify-content:center;
        -webkit-tap-highlight-color:transparent; padding:0; }
    body.show-hint .hint-btn { display:inline-flex; }
    .hint-btn:active { transform:scale(.9); }
    .hint-btn.busy { animation:hintPulse .7s infinite alternate; }
    @keyframes hintPulse { from { box-shadow:0 3px 10px rgba(0,0,0,.28); } to { box-shadow:0 0 18px rgba(88,204,2,.95); } }
    .hint-arrow-svg { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:45; }
    body.dark .hint-btn { background:rgba(53,70,87,.96); }

    /* 练习模式面板 */
    .practice-bar { display:none; background:#fff; border-radius:14px; padding:10px 13px 11px; margin-bottom:10px;
        box-shadow:0 2px 10px rgba(0,0,0,.07); }
    body.practice .practice-bar { display:block; }
    body.practice .color-slider-wrap { display:none; }
    body.practice .difficulty-selector label { min-width:56px; }
    .practice-title { display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
    .practice-name { font-size:.95rem; font-weight:600; color:#1f2937; cursor:pointer; }
    .practice-name::after { content:" ▾"; color:#9ca3af; font-size:.8em; }
    .practice-progress { font-size:.74rem; color:#6b7280; flex-shrink:0; }
    .practice-meta { display:inline-block; font-size:.66rem; color:#6b7280; background:#f3f4f6;
        border-radius:999px; padding:2px 8px; margin-top:5px; }
    .practice-goal { font-size:.76rem; color:#6b7280; margin-top:5px; line-height:1.55; }
    .practice-track { height:6px; border-radius:3px; background:#e5e7eb; margin-top:9px; overflow:hidden; }
    .practice-fill { height:100%; width:0; background:#c9962f; border-radius:3px; transition:width .25s, background .25s; }
    .practice-fill.warn { background:#f59e0b; }
    .practice-actions { display:flex; gap:8px; margin-top:10px; }
    .practice-actions .btn { flex:1; padding:7px 0; font-size:.8rem; }
    body.dark .practice-bar { background:#2b3a4b; }
    body.dark .practice-name { color:#e6ebf2; }
    body.dark .practice-goal, body.dark .practice-progress, body.dark .practice-meta { color:#a9b6c6; }
    body.dark .practice-meta { background:#354657; }
    body.dark .practice-track { background:#3e5162; }

    .picker-overlay { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none;
        align-items:center; justify-content:center; z-index:420; padding:18px; }
    .picker-overlay.show { display:flex; }
    .picker-panel { background:#fff; border-radius:20px; padding:16px 15px 13px; width:100%; max-width:340px;
        max-height:78vh; display:flex; flex-direction:column; box-shadow:0 10px 30px rgba(0,0,0,.22); }
    .picker-head { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:10px; }
    .picker-head h2 { font-size:1.02rem; font-weight:600; }
    .picker-sub { font-size:.7rem; color:#9ca3af; }
    .picker-list { overflow-y:auto; -webkit-overflow-scrolling:touch; flex:1; margin:0 -4px; padding:0 4px; }
    .picker-group { display:flex; align-items:center; gap:7px; font-size:.68rem; font-weight:600;
        color:#6b7280; letter-spacing:.6px; margin:11px 0 6px; }
    .picker-group::after { content:""; flex:1; height:1px; background:#eef1f4; }
    .picker-group:first-child { margin-top:0; }
    .picker-item { display:flex; align-items:center; gap:8px; width:100%; text-align:left; border:none;
        background:#f6f7f9; border-radius:9px; padding:8px 10px; margin-bottom:5px; cursor:pointer;
        font-size:.82rem; color:#374151; font-family:inherit; }
    .picker-item:active { background:#e9ecf1; }
    .picker-item.cur { background:#e8f8d8; box-shadow:inset 0 0 0 1px #c9962f; }
    .picker-no { width:20px; height:20px; border-radius:50%; background:#eef0f3; color:#6b7280;
        font-size:.68rem; font-weight:600; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .picker-item.cur .picker-no { background:#c9962f; color:#fff; }
    .picker-name { flex:1; font-weight:500; }
    .picker-tag { font-size:.66rem; color:#9ca3af; flex-shrink:0; }
    .picker-close { margin-top:10px; width:100%; }
    body.dark .picker-panel { background:#2b3a4b; color:#e6ebf2; }
    body.dark .picker-item { background:#354657; color:#cfd9e4; }
    body.dark .picker-item.cur { background:#2f4a2a; }
    body.dark .picker-sub, body.dark .picker-group, body.dark .picker-no, body.dark .picker-tag { color:#a9b6c6; }
    body.dark .picker-group::after { background:#3e5162; }

    /* 练习结算 */
    .practice-result { display:none; }
    .practice-result.show { display:block; }
    .pr-name { font-size:.8rem; color:#6b7280; }
    .pr-steps { display:flex; align-items:baseline; justify-content:center; gap:5px; margin-top:3px; }
    .pr-num { font-size:2.1rem; font-weight:700; line-height:1.05; color:#c9962f; font-variant-numeric:tabular-nums; }
    .pr-unit { font-size:.9rem; font-weight:500; color:#374151; }
    .pr-limit { font-size:.72rem; color:#9ca3af; margin-left:3px; }
    .pr-note { margin-top:12px; padding-top:11px; border-top:1px solid #f1f5f9; font-size:.82rem;
        color:#6b7280; line-height:1.65; }
    .practice-result.fail .pr-num { color:#f59e0b; }
    .modal.practice-ok h2 { color:#4a9e02; }
    .modal.practice-fail h2 { color:#d97706; }
    body.dark .pr-name { color:#a9b6c6; }
    body.dark .pr-unit { color:#cfd9e4; }
    body.dark .pr-limit { color:#8896a8; }
    body.dark .pr-note { color:#a9b6c6; border-top-color:#3e5162; }
    body.dark .modal.practice-ok h2 { color:#7fd13a; }
    body.dark .modal.practice-fail h2 { color:#f0a63c; }

    @media (max-width:400px) {
        .header h1 { font-size:1.2rem; }
        .btn { padding:8px 12px; font-size:.8rem; }
    }
</style>
</head>
<body>
<div class="header">
    <h1>中国象棋</h1>
</div>
<div class="game-container">
    <div class="status-bar" id="status">
        <div class="status-left">
            <span class="turn-indicator red" id="turnIndicator"></span>
            <span class="status-text" id="statusText">轮到红方走棋</span>
        </div>
        <div class="status-right">
            <span class="eval-score" id="evalScore">均势</span>
            <span class="thinking-indicator" id="thinkingIndicator">
                AI思考中
                <span class="thinking-dots"><span></span><span></span><span></span></span>
            </span>
        </div>
    </div>

    <div class="practice-bar" id="practiceBar">
        <div class="practice-title">
            <span class="practice-name" id="practiceName"></span>
            <span class="practice-progress" id="practiceProgress"></span>
        </div>
        <div class="practice-meta" id="practiceMeta"></div>
        <div class="practice-goal" id="practiceGoal"></div>
        <div class="practice-track"><div class="practice-fill" id="practiceFill"></div></div>
        <div class="practice-actions">
            <button class="btn" id="practicePrevBtn">上一题</button>
            <button class="btn" id="practiceRetryBtn">重试</button>
            <button class="btn primary" id="practiceNextBtn">下一题</button>
        </div>
    </div>

    <div class="color-slider-wrap" id="colorSliderWrap">

<script>
/* =========================================================================
   中国象棋引擎
   棋盘：10 行 × 9 列
   行 0 = 黑方底线（上方），行 9 = 红方底线（下方）
   列 0 = 最左（黑方视角的 9 路 / 红方视角的 九 路）
   红方为正数，黑方为负数
   ========================================================================= */
const XQ = (() => {
    const EMPTY = 0, KING = 1, ADVISOR = 2, ELEPHANT = 3, HORSE = 4, CHARIOT = 5, CANNON = 6, PAWN = 7;
    const RED = 1, BLACK = -1;
    const ROWS = 10, COLS = 9;
    const MATE = 100000;

    const VALUES = { [KING]: 100000, [CHARIOT]: 900, [CANNON]: 450, [HORSE]: 400,
                     [ADVISOR]: 200, [ELEPHANT]: 200, [PAWN]: 100 };

    /* ---- Zobrist 哈希 + 置换表（TT）---- */
    const ZOBRIST = (() => {
        let seed = 0x9e3779b9;
        const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed; };
        const table = [];
        for (let i = 0; i < 90; i++) { const row = []; for (let k = 0; k < 15; k++) row.push(rnd()); table.push(row); }
        const turnKey = rnd();
        const blackSideKey = rnd();
        function keyOf(board, color) {
            let h = turnKey;
            if (color === BLACK) h ^= blackSideKey;
            for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
                const p = board[r][c];
                if (p !== 0) h ^= table[r * COLS + c][p + 7];
            }
            return h;
        }
        return { table, turnKey, keyOf };
    })();
    const TT = new Map();
    const TT_MAX = 200000;
    const SAME_MOVE = (m1, m2) => !!m2 && m1.from[0] === m2.from[0] && m1.from[1] === m2.from[1]
        && m1.to[0] === m2.to[0] && m1.to[1] === m2.to[1];
    function probeTT(key, depth, alpha, beta) {
        const te = TT.get(key);
        if (!te) return { hit: false, move: null };
        if (te.depth >= depth) {
            if (Math.abs(te.score) > MATE - 1000) {
                return { hit: false, move: te.move };
            }
            if (te.flag === 'exact') return { hit: true, score: te.score, move: te.move };
            if (te.flag === 'lower' && te.score >= beta) return { hit: true, score: te.score, move: te.move };
            if (te.flag === 'upper' && te.score <= alpha) return { hit: true, score: te.score, move: te.move };
        }
        return { hit: false, move: te.move };
    }
    function storeTT(key, depth, score, alpha, beta, move) {
        if (TT.size > TT_MAX) TT.clear();
        let flag = 'exact';
        if (score <= alpha) flag = 'upper';
        else if (score >= beta) flag = 'lower';
        TT.set(key, { depth, score, flag, move: move || null });
    }

    const ORTHO = [[-1,0],[1,0],[0,-1],[0,1]];
    const DIAG  = [[-1,-1],[-1,1],[1,-1],[1,1]];

    const HORSE_MOVES = [
        [-2,-1,-1,0],[-2,1,-1,0],[2,-1,1,0],[2,1,1,0],
        [-1,-2,0,-1],[1,-2,0,-1],[-1,2,0,1],[1,2,0,1]
    ];

    function createInitialBoard() {
        const b = Array.from({length: ROWS}, () => new Array(COLS).fill(0));
        b[0] = [-CHARIOT, -HORSE, -ELEPHANT, -ADVISOR, -KING, -ADVISOR, -ELEPHANT, -HORSE, -CHARIOT];
        b[2][1] = -CANNON; b[2][7] = -CANNON;
        b[3][0] = -PAWN; b[3][2] = -PAWN; b[3][4] = -PAWN; b[3][6] = -PAWN; b[3][8] = -PAWN;
        b[6][0] = PAWN;  b[6][2] = PAWN;  b[6][4] = PAWN;  b[6][6] = PAWN;  b[6][8] = PAWN;
        b[7][1] = CANNON; b[7][7] = CANNON;
        b[9] = [CHARIOT, HORSE, ELEPHANT, ADVISOR, KING, ADVISOR, ELEPHANT, HORSE, CHARIOT];
        return b;
    }

    function cloneBoard(b) { return b.map(row => row.slice()); }
    function getType(p) { return p > 0 ? p : -p; }
    function getColor(p) { return p > 0 ? RED : BLACK; }
    function inBounds(r, c) { return r >= 0 && r < ROWS && c >= 0 && c < COLS; }
    function inPalace(r, c, color) {
        if (c < 3 || c > 5) return false;
        return color === RED ? (r >= 7 && r <= 9) : (r >= 0 && r <= 2);
    }

    function findKing(board, color) {
        const target = color * KING;
        for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
            if (board[r][c] === target) return [r, c];
        }
        return null;
    }

    function isSquareAttacked(board, r, c, byColor) {
        for (let d = 0; d < 4; d++) {
            const dr = ORTHO[d][0], dc = ORTHO[d][1];
            let nr = r + dr, nc = c + dc;
            let firstR = -1, firstC = -1, firstP = 0;
            while (inBounds(nr, nc)) {
                if (board[nr][nc] !== 0) { firstR = nr; firstC = nc; firstP = board[nr][nc]; break; }
                nr += dr; nc += dc;
            }
            if (firstR < 0) continue;
            if (getColor(firstP) === byColor) {
                const t = getType(firstP);
                if (t === CHARIOT) return true;
                if (t === KING) {
                    if (Math.abs(firstR - r) + Math.abs(firstC - c) === 1) return true;
                    if (dc === 0) return true;
                }
            }
            let mr = firstR + dr, mc = firstC + dc;
            while (inBounds(mr, mc)) {
                const q = board[mr][mc];
                if (q !== 0) {
                    if (getColor(q) === byColor && getType(q) === CANNON) return true;
                    break;
                }
                mr += dr; mc += dc;
            }
        }
        for (let i = 0; i < HORSE_MOVES.length; i++) {
            const h = HORSE_MOVES[i];
            const hr = r + h[0], hc = c + h[1];
            if (!inBounds(hr, hc)) continue;
            const q = board[hr][hc];
            if (q === 0 || getColor(q) !== byColor || getType(q) !== HORSE) continue;
            const ddr = -h[0], ddc = -h[1];
            let lr, lc;
            if (Math.abs(ddr) === 2) { lr = hr + ddr / 2; lc = hc; }
            else { lr = hr; lc = hc + ddc / 2; }
            if (board[lr][lc] === 0) return true;
        }
        if (byColor === RED) {
            if (inBounds(r + 1, c) && board[r + 1][c] === PAWN) return true;
            if (r <= 4) {
                for (let k = -1; k <= 1; k += 2) {
                    if (inBounds(r, c + k) && board[r][c + k] === PAWN) return true;
                }
            }
        } else {
            if (inBounds(r - 1, c) && board[r - 1][c] === -PAWN) return true;
            if (r >= 5) {
                for (let k = -1; k <= 1; k += 2) {
                    if (inBounds(r, c + k) && board[r][c + k] === -PAWN) return true;
                }
            }
        }
        return false;
    }

    function isInCheck(board, color) {
        const k = findKing(board, color);
        if (!k) return false;
        return isSquareAttacked(board, k[0], k[1], -color);
    }

    function generateMoves(board, color, capturesOnly) {
        const moves = [];
        const push = (r, c, tr, tc) => {
            const q = board[tr][tc];
            if (capturesOnly && q === 0) return;
            moves.push({ from: [r, c], to: [tr, tc], piece: board[r][c], captured: q });
        };
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const p = board[r][c];
                if (p === 0 || getColor(p) !== color) continue;
                const t = getType(p);

                if (t === KING) {
                    for (let d = 0; d < 4; d++) {
                        const nr = r + ORTHO[d][0], nc = c + ORTHO[d][1];
                        if (!inPalace(nr, nc, color)) continue;
                        const q = board[nr][nc];
                        if (q !== 0 && getColor(q) === color) continue;
                        push(r, c, nr, nc);
                    }
                } else if (t === ADVISOR) {
                    for (let d = 0; d < 4; d++) {
                        const nr = r + DIAG[d][0], nc = c + DIAG[d][1];
                        if (!inPalace(nr, nc, color)) continue;
                        const q = board[nr][nc];
                        if (q !== 0 && getColor(q) === color) continue;
                        push(r, c, nr, nc);
                    }
                } else if (t === ELEPHANT) {
                    for (let d = 0; d < 4; d++) {
                        const nr = r + DIAG[d][0] * 2, nc = c + DIAG[d][1] * 2;
                        if (!inBounds(nr, nc)) continue;
                        if (color === RED && nr < 5) continue;
                        if (color === BLACK && nr > 4) continue;
                        if (board[r + DIAG[d][0]][c + DIAG[d][1]] !== 0) continue;
                        const q = board[nr][nc];
                        if (q !== 0 && getColor(q) === color) continue;
                        push(r, c, nr, nc);
                    }
                } else if (t === HORSE) {
                    for (let i = 0; i < HORSE_MOVES.length; i++) {
                        const h = HORSE_MOVES[i];
                        const nr = r + h[0], nc = c + h[1];
                        if (!inBounds(nr, nc)) continue;
                        if (board[r + h[2]][c + h[3]] !== 0) continue;
                        const q = board[nr][nc];
                        if (q !== 0 && getColor(q) === color) continue;
                        push(r, c, nr, nc);
                    }
                } else if (t === CHARIOT) {
                    for (let d = 0; d < 4; d++) {
                        const dr = ORTHO[d][0], dc = ORTHO[d][1];
                        let nr = r + dr, nc = c + dc;
                        while (inBounds(nr, nc)) {
                            const q = board[nr][nc];
                            if (q === 0) {
                                if (!capturesOnly) moves.push({ from: [r, c], to: [nr, nc], piece: p, captured: 0 });
                            } else {
                                if (getColor(q) !== color) moves.push({ from: [r, c], to: [nr, nc], piece: p, captured: q });
                                break;
                            }
                            nr += dr; nc += dc;
                        }
                    }
                } else if (t === CANNON) {
                    for (let d = 0; d < 4; d++) {
                        const dr = ORTHO[d][0], dc = ORTHO[d][1];
                        let nr = r + dr, nc = c + dc;
                        let jumped = false;
                        while (inBounds(nr, nc)) {
                            const q = board[nr][nc];
                            if (!jumped) {
                                if (q === 0) {
                                    if (!capturesOnly) moves.push({ from: [r, c], to: [nr, nc], piece: p, captured: 0 });
                                } else {
                                    jumped = true;
                                }
                            } else {
                                if (q !== 0) {
                                    if (getColor(q) !== color) moves.push({ from: [r, c], to: [nr, nc], piece: p, captured: q });
                                    break;
                                }
                            }
                            nr += dr; nc += dc;
                        }
                    }
                } else if (t === PAWN) {
                    const forward = color === RED ? -1 : 1;
                    const nr = r + forward;
                    if (inBounds(nr, c)) {
                        const q = board[nr][c];
                        if (q === 0 || getColor(q) !== color) push(r, c, nr, c);
                    }
                    const crossed = color === RED ? (r <= 4) : (r >= 5);
                    if (crossed) {
                        for (let k = -1; k <= 1; k += 2) {
                            const nc = c + k;
                            if (!inBounds(r, nc)) continue;
                            const q = board[r][nc];
                            if (q === 0 || getColor(q) !== color) push(r, c, r, nc);
                        }
                    }
                }
            }
        }
        return moves;
    }

    function makeMove(board, move) {
        const cap = board[move.to[0]][move.to[1]];
        board[move.to[0]][move.to[1]] = board[move.from[0]][move.from[1]];
        board[move.from[0]][move.from[1]] = 0;
        return cap;
    }
    function unmakeMove(board, move, cap) {
        board[move.from[0]][move.from[1]] = board[move.to[0]][move.to[1]];
        board[move.to[0]][move.to[1]] = cap;
    }

    function legalMoves(board, color) {
        const pseudo = generateMoves(board, color, false);
        const out = [];
        for (let i = 0; i < pseudo.length; i++) {
            const m = pseudo[i];
            const cap = makeMove(board, m);
            if (!isInCheck(board, color)) out.push(m);
            unmakeMove(board, m, cap);
        }
        return out;
    }

    function evaluate(board) {
        let score = 0;
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const p = board[r][c];
                if (p === 0) continue;
                const color = p > 0 ? RED : BLACK;
                const t = getType(p);
                let v = VALUES[t] || 0;
                const rr = color === RED ? r : 9 - r;
                const cc = c;
                switch (t) {
                    case PAWN: {
                        const adv = 6 - rr;
                        if (adv > 0) v += adv * 14;
                        if (rr <= 4) v += 40;
                        if (cc >= 3 && cc <= 5) v += 12;
                        break;
                    }
                    case HORSE:
                        v += (4 - Math.abs(cc - 4)) * 6;
                        v += Math.max(0, rr - 3) * 4;
                        break;
                    case CANNON:
                        v += (4 - Math.abs(cc - 4)) * 4;
                        break;
                    case CHARIOT:
                        v += (4 - Math.abs(cc - 4)) * 3;
                        break;
                    case KING:
                        if (!inPalace(r, c, color)) v -= 50;
                        break;
                }
                score += color * v;
            }
        }
        return score;
    }

    function captureScore(m) {
        if (!m.captured) return 0;
        return (VALUES[getType(m.captured)] || 0) * 10 - (VALUES[getType(m.piece)] || 0);
    }

    function quiesce(board, alpha, beta, color, ctx) {
        if (ctx.abort) return 0;
        if ((++ctx.nodes & 1023) === 0 && Date.now() - ctx.start > ctx.limit) { ctx.abort = true; return 0; }

        const inCheck = isInCheck(board, color);
        let best;
        if (inCheck) {
            best = -MATE + ctx.ply;
        } else {
            const stand = evaluate(board) * color;
            if (stand >= beta) return stand;
            if (stand > alpha) alpha = stand;
            best = stand;
            if (ctx.qdepth >= 4) return stand;
        }

        let moves;
        if (inCheck) {
            moves = legalMoves(board, color);
        } else {
            const pseudo = generateMoves(board, color, true);
            moves = [];
            for (let i = 0; i < pseudo.length; i++) {
                const m = pseudo[i];
                const cap = makeMove(board, m);
                if (!isInCheck(board, color)) moves.push(m);
                unmakeMove(board, m, cap);
            }
        }
        if (moves.length === 0) return inCheck ? (-MATE + ctx.ply) : best;

        moves.sort((a, b) => captureScore(b) - captureScore(a));

        for (let i = 0; i < moves.length; i++) {
            const m = moves[i];
            const cap = makeMove(board, m);
            ctx.ply++;
            ctx.qdepth++;
            const v = -quiesce(board, -beta, -alpha, -color, ctx);
            ctx.qdepth--;
            ctx.ply--;
            unmakeMove(board, m, cap);
            if (ctx.abort) return 0;
            if (v > best) best = v;
            if (best > alpha) alpha = best;
            if (alpha >= beta) break;
        }
        return best;
    }

    function search(board, depth, alpha, beta, color, ctx) {
        if (ctx.abort) return 0;
        if ((++ctx.nodes & 1023) === 0 && Date.now() - ctx.start > ctx.limit) { ctx.abort = true; return 0; }

        if (depth <= 0) return quiesce(board, alpha, beta, color, ctx);

        const key = ZOBRIST.keyOf(board, color);
        const tt = probeTT(key, depth, alpha, beta);
        if (tt.hit) return tt.score;

        const moves = legalMoves(board, color);
        if (moves.length === 0) return -MATE + ctx.ply;

        moves.sort((a, b) => captureScore(b) - captureScore(a));
        if (tt.move) {
            const idx = moves.findIndex(m => SAME_MOVE(m, tt.move));
            if (idx > 0) { const t = moves[0]; moves[0] = moves[idx]; moves[idx] = t; }
        }

        let best = -Infinity;
        let bestMove = null;
        for (let i = 0; i < moves.length; i++) {
            const m = moves[i];
            const cap = makeMove(board, m);
            ctx.ply++;
            const v = -search(board, depth - 1, -beta, -alpha, -color, ctx);
            ctx.ply--;
            unmakeMove(board, m, cap);
            if (ctx.abort) return 0;
            if (v > best) { best = v; bestMove = m; }
            if (best > alpha) alpha = best;
            if (alpha >= beta) break;
        }
        if (Math.abs(best) < MATE - depth * 2) {
            storeTT(key, depth, best, alpha, beta, bestMove);
        }
        return best;
    }

    let lastNodes = 0;
    function getLastNodes() { return lastNodes; }

    function findBestMove(board, color, level) {
        const depthMap = { 1: 2, 2: 3, 3: 5 };
        const limitMap = { 1: 400, 2: 900, 3: 3000 };
        const marginMap = { 1: 90, 2: 35, 3: 0 };

        const maxDepth = depthMap[level] || 2;
        const timeLimit = limitMap[level] || 400;
        const margin = marginMap[level] !== undefined ? marginMap[level] : 0;

        const work = cloneBoard(board);
        const roots = legalMoves(work, color);
        if (roots.length === 0) return null;

        const ctx = { start: Date.now(), limit: timeLimit, abort: false, nodes: 0, ply: 0, qdepth: 0 };
        roots.sort((a, b) => captureScore(b) - captureScore(a));

        let bestMove = roots[0];
        let bestScores = null;

        for (let d = 1; d <= maxDepth; d++) {
            let localBest = null, localScore = -Infinity;
            const iter = [];
            let aborted = false;
            for (let i = 0; i < roots.length; i++) {
                const m = roots[i];
                const cap = makeMove(work, m);
                ctx.ply = 1;
                const v = -search(work, d - 1, -Infinity, Infinity, -color, ctx);
                unmakeMove(work, m, cap);
                if (ctx.abort) { aborted = true; break; }
                m.score = v;
                iter.push(m);
                if (v > localScore) { localScore = v; localBest = m; }
            }
            if (aborted) break;
            bestMove = localBest;
            bestScores = iter.map(m => ({ m: m, score: m.score }));
            roots.sort((a, b) => (b.score || 0) - (a.score || 0));
            if (Date.now() - ctx.start > timeLimit * 0.55) break;
        }
        lastNodes = ctx.nodes;

        let pool = bestScores ? bestScores.filter(s => s.score >= (bestScores[0].score - margin)) : null;
        if (!pool || pool.length === 0) return bestMove;
        if (level === 1 && pool.length > 1) {
            const safe = pool.filter(s => {
                const test = cloneBoard(board);
                const cap = makeMove(test, s.m);
                const recapture = legalMoves(test, -color).some(r =>
                    r.to[0] === s.m.to[0] && r.to[1] === s.m.to[1] &&
                    (VALUES[getType(r.piece)] || 0) >= 400
                );
                const gain = s.m.captured ? (VALUES[getType(s.m.captured)] || 0) : 0;
                const loss = (VALUES[getType(s.m.piece)] || 0);
                const bad = recapture && gain < loss - 200;
                unmakeMove(test, s.m, cap);
                return !bad;
            });
            if (safe.length) pool = safe;
        }
        const pick = Math.min(pool.length - 1, Math.floor(Math.pow(Math.random(), 1.6) * pool.length));
        return pool[pick].m;
    }

    return {
        RED, BLACK, KING, ADVISOR, ELEPHANT, HORSE, CHARIOT, CANNON, PAWN,
        ROWS, COLS, MATE,
        createInitialBoard, cloneBoard, getType, getColor, inBounds, inPalace,
        findKing, isSquareAttacked, isInCheck,
        generateMoves, legalMoves, makeMove, unmakeMove,
        evaluate, findBestMove, getLastNodes
    };
})();

/* ===================== 音效 ===================== */
const SoundManager = (() => {
    let audioCtx = null, master = null, muted = false;

    function setMuted(v) {
        muted = !!v;
        if (master) master.gain.value = muted ? 0 : 0.9;
    }
    function isMuted() { return muted; }

    function initAudio() {
        if (muted) return false;
        if (!audioCtx) {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                master = audioCtx.createGain();
                master.gain.value = 0.9;
                master.connect(audioCtx.destination);
            } catch (e) { audioCtx = null; return false; }
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
        return true;
    }

    function tone(freq, dur, type, vol, delay, endFreq) {
        if (!audioCtx || !master) return;
        const t0 = audioCtx.currentTime + (delay || 0);
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = type || 'triangle';
        osc.frequency.setValueAtTime(freq, t0);
        if (endFreq) osc.frequency.exponentialRampToValueAtTime(Math.max(20, endFreq), t0 + dur);
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(vol, t0 + 0.006);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        osc.connect(g); g.connect(master);
        osc.start(t0); osc.stop(t0 + dur + 0.02);
    }

    function knock(dur, vol, delay, hp) {
        if (!audioCtx || !master) return;
        const t0 = audioCtx.currentTime + (delay || 0);
        const len = Math.max(1, Math.floor(audioCtx.sampleRate * dur));
        const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.4);
        const s = audioCtx.createBufferSource(); s.buffer = buf;
        const f = audioCtx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp || 1200;
        const g = audioCtx.createGain(); g.gain.value = vol;
        s.connect(f); f.connect(g); g.connect(master);
        s.start(t0);
    }

    function playMove() {
        if (!initAudio()) return;
        tone(300, 0.09, 'triangle', 0.16, 0, 190);
        knock(0.04, 0.11, 0, 1400);
    }
    function playCapture() {
        if (!initAudio()) return;
        tone(200, 0.15, 'triangle', 0.2, 0, 110);
        knock(0.075, 0.16, 0, 850);
        tone(1400, 0.03, 'square', 0.045, 0.005);
    }
    function playCheck() {
        if (!initAudio()) return;
        tone(720, 0.1, 'square', 0.09);
        tone(960, 0.17, 'square', 0.1, 0.1);
    }
    function playGameEnd() {
        if (!initAudio()) return;
        [[523,0],[659,0.13],[784,0.26],[1047,0.40]].forEach(p => tone(p[0], 0.22, 'sine', 0.15, p[1]));
    }

    return { playMove, playCapture, playCheck, playGameEnd, setMuted, isMuted };
})();
